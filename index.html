<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FIFA Agent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Тренажер іспиту FIFA Football Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --paper:#F7F9FB; --sheet:#FFFFFF; --line:#D9E0E8; --muted:#5B6678;
  --pitch:#1F7A4D; --pitch-soft:#E3F2EA; --red:#C8102E; --red-soft:#FBE6E9; --card:#F2C230; --card-soft:#FDF5D6;
  --board:#14213D; --board-ink:#F7F9FB;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E8EDF4; --paper:#0F1626; --sheet:#172036; --line:#2A3550; --muted:#9AA6BA;
  --pitch:#4CC38A; --pitch-soft:#173A2B; --red:#FF6B7F; --red-soft:#3A1A22; --card:#F2C230; --card-soft:#3A3217;
  --board:#0A101D; --board-ink:#E8EDF4;}}
:root[data-theme="dark"]{
  --ink:#E8EDF4; --paper:#0F1626; --sheet:#172036; --line:#2A3550; --muted:#9AA6BA;
  --pitch:#4CC38A; --pitch-soft:#173A2B; --red:#FF6B7F; --red-soft:#3A1A22; --card:#F2C230; --card-soft:#3A3217;
  --board:#0A101D; --board-ink:#E8EDF4;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--card);outline-offset:2px}
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:var(--board-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px}
.board .name{font:600 20px/1 var(--cond);letter-spacing:.02em}
.board .name small{display:block;font:500 13px/1.3 var(--sans);opacity:.7;letter-spacing:0}
.clock{font:700 34px/1 var(--cond);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:4px;min-width:96px;text-align:center}
.clock.warn{color:var(--card)} .clock.end{color:#FF6B7F}
.clock .lab{display:block;font:500 11px/1.2 var(--sans);opacity:.7}
main{max-width:760px;margin:0 auto;padding:22px 18px 60px}
h1{font:700 44px/1.02 var(--cond);margin:8px 0 12px;letter-spacing:-.005em}
h2{font:600 26px/1.1 var(--cond);margin:28px 0 10px}
p{margin:0 0 12px}
.lead{font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--muted);max-width:62ch}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--sheet);border:2px solid var(--line);border-radius:6px;padding:16px}
.mode b{display:block;font:600 24px/1.1 var(--cond);margin-bottom:4px}
.mode span{color:var(--muted);font-size:14px}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 6px 0 0 var(--pitch)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 20px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.go{background:var(--pitch);color:#fff;border:0;border-radius:6px;padding:14px 26px;font:700 22px/1 var(--cond);letter-spacing:.02em}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:10px 16px;font-weight:500}
.hist{margin-top:28px;border-top:1px solid var(--line)}
.hist div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist .ok{color:var(--pitch);font-weight:600} .hist .no{color:var(--red);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin-bottom:10px}
.tag{border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:12px}
.qtext{font:400 21px/1.55 var(--serif);margin:6px 0 20px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:6px;padding:13px 14px;line-height:1.45}
.opt .k{flex:none;font:700 18px/1.25 var(--cond);width:22px;color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
.opt.right{border-color:var(--pitch);background:var(--pitch-soft);box-shadow:inset 4px 0 0 var(--pitch)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);box-shadow:inset 4px 0 0 var(--red)}
.opt:disabled{cursor:default;opacity:1}
.expl{margin-top:16px;padding:14px 16px;border-radius:6px;background:var(--sheet);border:1px solid var(--line);font-size:15px}
.expl .ref{display:block;margin-top:6px;font-weight:600;color:var(--pitch)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.flag[aria-pressed="true"]{background:var(--card-soft);border-color:var(--card)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:26px}
@media (max-width:480px){.grid{grid-template-columns:repeat(5,1fr)}}
.cell{aspect-ratio:1;border:1.5px solid var(--line);background:var(--sheet);border-radius:4px;font:600 16px/1 var(--cond);position:relative}
.cell.done{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cell.cur{outline:3px solid var(--pitch);outline-offset:1px}
.cell.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:10px;background:var(--card);border-radius:1px}
.cell.r{background:var(--pitch);border-color:var(--pitch);color:#fff}.cell.w{background:var(--red);border-color:var(--red);color:#fff}
.score{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:10px 0 6px}
.score .big{font:700 92px/.9 var(--cond);font-variant-numeric:tabular-nums}
.verdict{font:700 26px/1.1 var(--cond);padding:6px 12px;border-radius:4px}
.verdict.ok{background:var(--pitch);color:#fff}.verdict.no{background:var(--red);color:#fff}
.bars div{display:grid;grid-template-columns:minmax(120px,190px) 1fr 52px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pitch)}
.rev{border-top:1px solid var(--line);padding:16px 0}
.rev .qtext{font-size:17px;margin:4px 0 10px}
.rev .ans{font-size:15px;margin:3px 0}
.rev .ans.g{color:var(--pitch)}.rev .ans.b{color:var(--red)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.note{font-size:13px;color:var(--muted);margin-top:30px;max-width:62ch}
@media (prefers-reduced-motion:no-preference){.opt,.cell,.chip,.mode{transition:background .15s,border-color .15s}}
.expl p{margin:8px 0 0}
.expl .pick{font-size:14px;color:var(--muted)}
.expl .pick b{color:var(--ink);font-weight:600}
.expl .more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-family:var(--serif);font-size:16px;line-height:1.6}
.expl details{margin-top:8px}.expl summary{cursor:pointer;color:var(--muted);font-size:14px}
.expl.bad{border-color:var(--red)}.expl.good{border-color:var(--pitch)}
.concept{margin-top:12px;padding:12px 14px;border-radius:6px;background:var(--paper);border:1px solid var(--line)}
.concept h3{margin:0 0 8px;font:600 21px/1.15 var(--cond)}
.concept dl{margin:0}.concept dt{font-weight:600;font-size:14px;margin-top:8px;color:var(--pitch)}
.concept dd{margin:2px 0 0;font-size:15px;line-height:1.55}
.why{margin-top:12px}.why b{display:block;font-size:14px;margin-bottom:2px}
.expl .more{font-family:var(--sans);font-size:15px}
.qtr{font-size:15px;line-height:1.45;color:var(--muted);margin:-12px 0 18px}
.opt .tx{display:flex;flex-direction:column;gap:3px}
.opt .tr{font-size:13px;line-height:1.35;color:var(--muted)}
.pick .tr{display:block;font-size:13px;font-weight:400;margin-bottom:4px}
.rev .qtr{margin:-6px 0 10px;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 12px}
.opt .box{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:4px;margin-top:2px;display:grid;place-items:center;font-size:13px;font-weight:700}
.opt[aria-checked="true"] .box{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.right .box{background:var(--pitch);border-color:var(--pitch);color:#fff}
.opt.wrong .box{background:var(--red);border-color:var(--red);color:#fff}
.opt.missed{border:2px dashed var(--pitch);background:var(--pitch-soft)}
.opt .miss{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:var(--pitch)}
.submit{margin-top:14px;width:100%}
.submit:disabled{opacity:.45;cursor:default}
.multi{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-left:6px}
.reflink{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--pitch);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,16,29,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);color:var(--ink);width:100%;max-width:760px;max-height:88%;display:flex;flex-direction:column;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-doc{font-size:12px;color:var(--muted)}
.sheet-title{font:600 22px/1.15 var(--cond);margin-top:2px}
.sheet-body{overflow-y:auto;padding:12px 18px 24px;font:400 16px/1.6 var(--serif)}
.sheet-body p{margin:0 0 10px}
.sheet-body p.sub{padding-left:18px}
.sheet-body p.hit{background:var(--card-soft);border-left:4px solid var(--card);padding:8px 10px;border-radius:4px}
.sheet-note{font:13px/1.4 var(--sans);color:var(--muted);margin-top:16px}

/* compact */
.board{padding:6px 14px}.board .name{font-size:17px}.board .name small{font-size:11px}
.clock{font-size:24px;padding:4px 8px;min-width:72px}.clock .lab{display:none}
main{padding:12px 14px 40px}
.meta{font-size:13px;margin-bottom:6px}.meta .prog{color:var(--ink);font-size:15px}
.hint2{font-size:12px;color:var(--muted)}
.qtext{font-size:18px;line-height:1.45;margin:2px 0 4px}
.qtr{font-size:13px;line-height:1.4;margin:0 0 10px}
.opts{gap:6px}
.opt{padding:8px 10px;gap:9px;line-height:1.35;font-size:15px}
.opt .k{font-size:16px;width:14px}.opt .box{width:18px;height:18px;margin-top:1px}
.opt .tr{font-size:12px}
.expl{margin-top:10px;padding:10px 12px;font-size:14px}
.expl p{margin:6px 0 0}.why{margin-top:8px}.expl details{margin-top:6px}
.concept{margin-top:8px;padding:10px 12px}.concept dd{font-size:14px}
.nav.bar .go{padding:12px 14px;font-size:19px}
.nav.bar .go:disabled{opacity:.45;cursor:default}
.ghost{padding:9px 12px}
.ansrow{display:flex;gap:8px;margin-top:12px}.ansrow .submit{margin-top:0;flex:2}.ansrow .dk{flex:1}
.expl.dkbox{border-color:var(--card)}
.chip.hardchip{border-color:var(--card)}
.chip.hardchip[aria-pressed="true"]{background:var(--card);color:#14213D;border-color:var(--card)}
</style>
</head>
<body>
<header class="board">
  <div class="name">FIFA Football Agent Exam<small>Тренажер</small></div>
  <div class="clock" id="clock" hidden><span class="lab">залишилось</span><span id="ct">60:00</span></div>
</header>
<main id="app"></main>
<script>
const Q = [
// ===== FFAR =====
{t:"FFAR",q:"What is the maximum duration of a Representation Agreement between a Football Agent and a player?",o:["Two years","Three years","Five years","No maximum duration"],a:0,e:"Угода з Individual (гравцем або тренером) — максимум 2 роки. Продовжити можна лише новою угодою; автоматична пролонгація нікчемна.",r:"FFAR ст. 12 п. 3"},
{t:"FFAR",q:"A Representation Agreement between a Football Agent and an Engaging Entity (club) is subject to which maximum duration?",o:["No maximum duration","One year","Two years","The duration of the player's employment contract"],a:0,e:"Для угод із клубом (Engaging або Releasing Entity) максимального строку немає.",r:"FFAR ст. 12 п. 5"},
{t:"FFAR",q:"A Representation Agreement with a player contains a clause automatically renewing it for another two years unless terminated. What is the status of this clause?",o:["It is null and void","It is valid if the player signed it","It is valid only for players over 18","It is valid if approved by the member association"],a:0,e:"Будь-яке положення про автоматичне продовження понад максимальний строк є нікчемним (null and void).",r:"FFAR ст. 12 п. 3"},
{t:"FFAR",q:"In which situation is dual representation permitted under the FIFA Football Agent Regulations?",o:["Agent acts for the player and the Engaging Entity, with prior explicit written consent of both","Agent acts for the player and the Releasing Entity, with written consent of both","Agent acts for the Releasing and Engaging Entities, with FIFA approval","Agent acts for all parties if the fee is below the cap"],a:0,e:"Єдиний дозволений випадок — гравець + клуб, що наймає (Engaging Entity), за попередньою явною письмовою згодою обох клієнтів.",r:"FFAR ст. 12 п. 8 a)"},
{t:"FFAR",q:"Which combination of Clients is explicitly prohibited for one agent in the same Transaction?",o:["Releasing Entity and the player","Engaging Entity and the player","Only the player","Only the Engaging Entity"],a:0,e:"Заборонено представляти в одній угоді: Releasing Entity + гравця; Releasing + Engaging Entity; усі сторони одночасно.",r:"FFAR ст. 12 п. 9"},
{t:"FFAR",q:"Agent A and Agent B are siblings working for different agencies. Can they act for the Releasing Entity and the player respectively in the same Transaction?",o:["No, they are Connected Football Agents","Yes, because they work for different agencies","Yes, if both Clients consent in writing","Yes, if the fee is paid through the Clearing House"],a:0,e:"Брати/сестри — Connected Football Agents. Пов'язані агенти не можуть діяти для різних клієнтів в одній угоді, крім дозволеного подвійного представництва (гравець + Engaging Entity).",r:"FFAR визначення «Connected Football Agent»; ст. 12 п. 10"},
{t:"FFAR",q:"Which of the following relationships does NOT by itself make two agents 'Connected Football Agents'?",o:["They are cousins","They are married","They are parent and stepchild","They are co-owners of the same Agency"],a:0,e:"Пов'язаність: спільна агенція (працівники, власники, директори), шлюб/цивільне партнерство, брати й сестри, батьки й діти/пасинки, домовленості про співпрацю більше одного разу. Двоюрідні не названі.",r:"FFAR, Definitions"},
{t:"FFAR",q:"A player has an exclusive Representation Agreement with Agent X expiring on 30 June. From when may Agent Y Approach the player?",o:["From 1 May (final two months)","From 1 January (final six months)","Only after 30 June","At any time, if the player initiates contact"],a:0,e:"Не можна контактувати з клієнтом, пов'язаним ексклюзивною угодою з іншим агентом, окрім останніх двох місяців її дії.",r:"FFAR ст. 16 п. 1 b)–c)"},
{t:"FFAR",q:"In a country where players may sign their first professional contract at 16, when may an agent first Approach a minor?",o:["No earlier than six months before the player turns 16, with prior written consent of the legal guardian","At any age with the guardian's consent","Only after the player turns 16","No earlier than one year before the player turns 16"],a:0,e:"Контакт з неповнолітнім — не раніше ніж за 6 місяців до віку першого професійного контракту і лише після письмової згоди законного представника.",r:"FFAR ст. 13 п. 1"},
{t:"FFAR",q:"What is the minimum sanction for approaching a minor in breach of article 13 paragraph 1 of the FFAR?",o:["A fine and a suspension of the licence of up to two years","A warning","A fine only","Permanent withdrawal of the licence"],a:0,e:"Порушення ст. 13 п. 1 карається щонайменше штрафом і призупиненням ліцензії до двох років.",r:"FFAR ст. 13 п. 4"},
{t:"FFAR",q:"What must an agent complete before representing a minor or a club in a Transaction involving a minor?",o:["The designated CPD course on minors","A second FIFA exam","A national licence","Nothing beyond the FIFA licence"],a:0,e:"Агент має спершу успішно пройти спеціальний курс CPD щодо неповнолітніх і виконати вимоги національного закону.",r:"FFAR ст. 13 п. 2"},
{t:"FFAR",q:"An agent represents a player whose annual Remuneration is USD 150,000. What is the maximum annual service fee?",o:["USD 7,500","USD 4,500","USD 15,000","USD 9,000"],a:0,e:"До USD 200 000 включно — 5% від Remuneration гравця: 150 000 × 5% = 7 500.",r:"FFAR ст. 15 п. 2"},
{t:"FFAR",q:"An agent represents only the player, whose annual Remuneration is USD 500,000. What is the maximum annual service fee?",o:["USD 19,000","USD 15,000","USD 25,000","USD 30,000"],a:0,e:"5% від перших 200 000 = 10 000, плюс 3% від надлишку 300 000 = 9 000. Разом 19 000.",r:"FFAR ст. 15 п. 2 і п. b)"},
{t:"FFAR",q:"Under permitted dual representation (player + Engaging Entity), the player's annual Remuneration is USD 1,000,000. What is the maximum annual service fee?",o:["USD 68,000","USD 60,000","USD 100,000","USD 38,000"],a:0,e:"10% від 200 000 = 20 000, плюс 6% від надлишку 800 000 = 48 000. Разом 68 000.",r:"FFAR ст. 15 п. 2 і п. b)"},
{t:"FFAR",q:"An agent represents the Releasing Entity. Transfer compensation is EUR 5 million plus a 20% sell-on clause. What is the base for the service fee cap?",o:["EUR 5 million (10% cap = EUR 500,000)","EUR 5 million plus any sell-on (10% cap)","The player's Remuneration (10% cap)","EUR 5 million (3% cap = EUR 150,000)"],a:0,e:"Для Releasing Entity — 10% від трансферної компенсації. Sell-on та компенсацію за порушення контракту (ст. 17 RSTP) не враховують.",r:"FFAR ст. 15 п. 1 b), п. 2, п. c)"},
{t:"FFAR",q:"When may the Engaging Entity pay the player's agent on the player's behalf?",o:["When the player's annual Remuneration is less than USD 200,000, excluding conditional payments","Always, if the player agrees","Never","When the player is a minor"],a:0,e:"Єдиний виняток із принципу «платить лише клієнт»: Remuneration гравця менше USD 200 000 без умовних виплат; клуб не може вирахувати цю суму із зарплати гравця.",r:"FFAR ст. 14 пп. 2–3"},
{t:"FFAR",q:"Under permitted dual representation, what portion of the total service fee may the Engaging Entity pay?",o:["Up to 50%","Up to 100%","Up to 25%","None"],a:0,e:"У разі дозволеного подвійного представництва клуб може сплатити не більше 50% загальної винагороди.",r:"FFAR ст. 14 п. 10"},
{t:"FFAR",q:"When must service fees under a player's employment contract (longer than six months) be paid?",o:["After the closure of the registration period, in instalments every three months","In full upon signing the contract","Annually at the end of each season","Monthly with the player's salary"],a:0,e:"Після закриття реєстраційного періоду, частинами кожні три місяці протягом дії контракту. Якщо контракт коротший за 6 місяців — одним платежем після його закінчення.",r:"FFAR ст. 14 пп. 6, 8"},
{t:"FFAR",q:"Within 18 months after a Transaction, the agent provides image-rights consultancy to the club involved. What applies?",o:["It is presumed part of the Football Agent Services unless proven otherwise","It is fully separate as Other Services","It is prohibited","It must be approved by FIFA"],a:0,e:"Other Services, надані протягом 24 місяців до або після угоди, вважаються частиною агентських послуг, доки не доведено протилежне — і рахуються в межах ліміту.",r:"FFAR ст. 15 пп. 3–4"},
{t:"FFAR",q:"Within how many days must an agent upload a signed Representation Agreement to the Platform?",o:["14 days","30 days","60 days","90 days"],a:0,e:"Угоду, її зміну чи розірвання завантажують протягом 14 днів. Зміни щодо агенції — протягом 30 днів.",r:"FFAR ст. 16 п. 2 j) i, k) iii"},
{t:"FFAR",q:"After passing the exam, within what period must the applicant pay the annual licence fee?",o:["90 days, otherwise the application is void","30 days","60 days","Before the next exam session"],a:0,e:"Річний внесок треба сплатити протягом 90 днів після складання іспиту, інакше заявку автоматично анулюють.",r:"FFAR ст. 7 п. 3"},
{t:"FFAR",q:"An agent fails to meet the CPD requirements in a calendar year. What happens?",o:["Automatic provisional suspension; licence withdrawn if not rectified within 60 days","Immediate withdrawal of the licence","A warning only","Referral to CAS"],a:0,e:"Несплата внеску, невиконання CPD чи звітності → автоматичне тимчасове призупинення; якщо не виправити за 60 днів — ліцензію відкликають.",r:"FFAR ст. 17 пп. 1, 4"},
{t:"FFAR",q:"Which applicant is NOT eligible for a licence?",o:["Someone who held an interest in a betting company 6 months before applying","Someone declared bankrupt 7 years before applying","Someone suspended for 18 months by a sports body for ethics breaches","Someone who works as a lawyer"],a:0,e:"Інтерес у беттінгу — заборонено протягом 12 місяців до заявки. Банкрутство — 5 років. Відсторонення має бути 2 роки чи більше.",r:"FFAR ст. 5 п. 1 a) iii, c), d)"},
{t:"FFAR",q:"Which of the following is NOT a minimum requirement for a valid Representation Agreement?",o:["The governing law","The names of the parties","The amount of the service fee","The nature of the Football Agent Services"],a:0,e:"Обов'язкові: імена сторін, строк (якщо застосовно), сума винагороди, характер послуг, підписи сторін.",r:"FFAR ст. 12 п. 7"},
{t:"FFAR",q:"A Representation Agreement says the player must pay a penalty if he negotiates a contract without the agent. This clause is:",o:["Null and void","Valid if exclusive","Valid for up to 5% of Remuneration","Valid if the player had legal advice"],a:0,e:"Будь-яке положення, що обмежує чи штрафує гравця за самостійні переговори без агента, нікчемне.",r:"FFAR ст. 12 п. 13"},
{t:"FFAR",q:"Before signing or amending a Representation Agreement with a player, the agent must:",o:["Inform the player in writing to consider independent legal advice and obtain written confirmation","Obtain approval from the player's club","Register the agreement with the national association first","Have the agreement notarised"],a:0,e:"Агент письмово радить звернутися по незалежну юридичну пораду й отримує письмове підтвердження, що гравець це зробив або відмовився.",r:"FFAR ст. 12 п. 4"},
{t:"FFAR",q:"Which of these is NOT included in 'Remuneration' under the FFAR?",o:["A car provided by the club","Sign-on fee","Base salary","Performance bonus"],a:0,e:"До Remuneration входять базова зарплата, sign-on fee та умовні виплати. Немонетарні вигоди (авто, житло, телефон) і майбутні трансферні виплати — ні.",r:"FFAR, Definitions «Remuneration»"},
{t:"FFAR",q:"Who has jurisdiction over a dispute arising from a Representation Agreement with an international dimension, and within what time limit?",o:["The Agents Chamber of the Football Tribunal, within two years of the event","The Dispute Resolution Chamber, within five years","CAS directly, within 21 days","The national association, within one year"],a:0,e:"Agents Chamber (без шкоди праву на звичайний суд), якщо минуло не більше двох років від події; строк перевіряють ex officio.",r:"FFAR ст. 20 п. 1"},
{t:"FFAR",q:"A FIFA Football Agent licence is:",o:["Indefinite, strictly personal and valid worldwide","Valid for five years and transferable to the agency","Valid only in the agent's country","Renewed every two years by exam"],a:0,e:"Ліцензія видається фізичній особі безстроково (з урахуванням ст. 17), є особистою, непередаваною і діє в усьому світі.",r:"FFAR ст. 8"},
{t:"FFAR",q:"Which of the following may NOT hold an Interest in a Football Agent's Agency?",o:["A Client of the agent","A non-football investment fund","The agent's spouse who is not a Client","A bank lending to the Agency"],a:0,e:"Інтерес в агенції заборонено мати клієнтам, особам, що не відповідають критеріям ст. 5, та власникам прав на гравців (TPO).",r:"FFAR ст. 11 п. 4"},
{t:"FFAR",q:"The player transfers to a new club while his negotiated contract still has two years remaining. What happens to fees not yet due under that contract?",o:["The agent is not entitled to them","They become immediately payable","The new club must pay them","They are paid by the Releasing Entity"],a:0,e:"Якщо гравець переходить в іншу команду до закінчення контракту, агент втрачає право на ще не належні виплати.",r:"FFAR ст. 14 п. 12 a)"},
{t:"FFAR",q:"A Representation Agreement relates only to a national transfer. Which regulations govern it?",o:["The national football agent regulations where the Client is registered/domiciled when the agreement is signed","The FIFA FFAR only","The regulations of the agent's home country","No regulations apply"],a:0,e:"Без міжнародного виміру діють національні правила асоціації, де клієнт зареєстрований або проживає на момент підписання.",r:"FFAR ст. 2 п. 3"},
{t:"FFAR",q:"When may an agent receive a service fee for services relating to a minor?",o:["Only when the player signs a first or subsequent professional contract","Never","At any time with guardian consent","Only when the minor turns 18"],a:0,e:"Винагорода щодо неповнолітнього можлива лише коли він підписує перший або наступний професійний контракт.",r:"FFAR ст. 14 п. 9"},
// ===== RSTP =====
{t:"RSTP",q:"A player signs a contract on his 26th birthday. What is the protected period?",o:["Three entire seasons or three years, whichever comes first","Two entire seasons or two years, whichever comes first","The whole contract","One season"],a:0,e:"Контракт до 28-го дня народження — 3 сезони/3 роки; після 28 — 2 сезони/2 роки (що настане раніше).",r:"RSTP, Definitions п. 7"},
{t:"RSTP",q:"What sporting sanction applies to a player who breaches his contract without just cause during the protected period?",o:["Four-month restriction on playing official matches (six with aggravating circumstances)","Two-month restriction","Ban of two registration periods","No sporting sanction, only compensation"],a:0,e:"Чотири місяці без офіційних матчів; за обтяжувальних обставин — шість.",r:"RSTP ст. 17 п. 3"},
{t:"RSTP",q:"What sporting sanction applies to a club found in breach of contract during the protected period?",o:["Ban on registering new players for two entire and consecutive registration periods","Fine only","Deduction of six points","Ban for one registration period"],a:0,e:"Заборона реєструвати нових гравців на два повні послідовні реєстраційні періоди; виняток ст. 6 п. 3 не застосовується.",r:"RSTP ст. 17 п. 4"},
{t:"RSTP",q:"What is the maximum length of a professional contract for a 17-year-old player?",o:["Three years","Five years","Two years","Until the player turns 18"],a:0,e:"Загальний максимум — 5 років; гравці до 18 років — не більше трьох.",r:"RSTP ст. 18 п. 2"},
{t:"RSTP",q:"When is a professional free to conclude a contract with another club?",o:["When his current contract has expired or is due to expire within six months","At any time after the protected period","When his contract expires within twelve months","Only during a registration period"],a:0,e:"Вільний підписати контракт, коли поточний закінчився або закінчиться протягом шести місяців. Новий клуб має спершу письмово повідомити поточний клуб.",r:"RSTP ст. 18 п. 3"},
{t:"RSTP",q:"A contract states it is valid only if the player passes a medical examination. This condition is:",o:["Not permitted","Valid","Valid only for international transfers","Valid if the player is over 28"],a:0,e:"Чинність контракту не може залежати від медогляду або отримання дозволу на роботу.",r:"RSTP ст. 18 п. 4"},
{t:"RSTP",q:"A club fails to pay a player two monthly salaries on their due dates. What must the player do to terminate with just cause?",o:["Put the club in default in writing and grant at least 15 days to pay","Terminate immediately","Wait 30 days and notify FIFA","Grant at least 10 days"],a:0,e:"Письмова вимога і строк щонайменше 15 днів на погашення; тоді є just cause.",r:"RSTP ст. 14bis п. 1"},
{t:"RSTP",q:"An established professional appeared in 8% of his club's official matches during the season. What may he do?",o:["Terminate for sporting just cause within 15 days after the club's last official match of the season","Terminate at any time during the season","Nothing, unless he was injured","Terminate within 30 days after the season"],a:0,e:"Менше 10% офіційних матчів → sporting just cause; розірвати можна протягом 15 днів після останнього офіційного матчу сезону. Компенсація може бути, санкцій — ні.",r:"RSTP ст. 15"},
{t:"RSTP",q:"What are the limits on registration periods?",o:["First: 8–12 weeks; second: 4–8 weeks; total not more than 16 weeks","First: 12 weeks; second: 4 weeks; total 16 weeks exactly","Each no longer than 12 weeks","First: 6–10 weeks; second: 4–6 weeks"],a:0,e:"Перше вікно 8–12 тижнів, друге 4–8 тижнів, разом не більше 16 тижнів.",r:"RSTP ст. 6 п. 2"},
{t:"RSTP",q:"What are the minimum and maximum durations of a loan agreement?",o:["Minimum: time between two registration periods; maximum: one year","Minimum: six months; maximum: two years","Minimum: one season; maximum: one season","No minimum; maximum: 18 months"],a:0,e:"Мінімум — час між двома реєстраційними періодами, максимум — рік; дата завершення має припадати на реєстраційний період асоціації клубу-власника.",r:"RSTP ст. 10 п. 1 d)"},
{t:"RSTP",q:"How many professionals may a club have loaned out to one specific club at any given time during a season?",o:["Three","Six","Two","Unlimited"],a:0,e:"Загалом до 6 позичених і 6 взятих в оренду; до одного конкретного клубу — до трьох (незалежно від віку).",r:"RSTP ст. 10 пп. 6, 8"},
{t:"RSTP",q:"May a club that takes a player on loan sub-loan him to a third club?",o:["No, it is prohibited","Yes, with the player's consent","Yes, with the former club's consent","Yes, within the same association"],a:0,e:"Новому клубу заборонено передавати гравця в суборенду або продавати його третьому клубу.",r:"RSTP ст. 10 п. 1 f)"},
{t:"RSTP",q:"When is a bridge transfer presumed?",o:["Two consecutive transfers of the same player within 16 weeks","Two transfers within one season","Any loan followed by a permanent transfer","Two transfers within 12 months"],a:0,e:"Два послідовні трансфери (національні чи міжнародні) протягом 16 тижнів — презумпція bridge transfer, якщо не доведено протилежне.",r:"RSTP ст. 5bis п. 2"},
{t:"RSTP",q:"When may a club be sanctioned for overdue payables?",o:["Payment delayed more than 30 days; creditor put debtor in default with at least 10 days' deadline","Payment delayed more than 15 days","Payment delayed more than 60 days","Any delay after a written reminder"],a:0,e:"Прострочка понад 30 днів без договірної підстави + письмова вимога зі строком щонайменше 10 днів.",r:"RSTP ст. 12bis пп. 2–3"},
{t:"RSTP",q:"A 17-year-old moves from Ukraine to a club in Germany without his parents. Which exception to article 19 could apply?",o:["None of the EU/EEA exception, as the move is from outside the EU/EEA","The EU/EEA exception (16–18)","The 50 km border rule","Automatically allowed at 17"],a:0,e:"Виняток 16–18 діє для трансферів усередині ЄС/ЄЕЗ або між асоціаціями однієї країни. Примітка: для України діють також тимчасові правила Annexe 7 — у реальному кейсі їх треба перевіряти окремо.",r:"RSTP ст. 19 п. 2 b)"},
{t:"RSTP",q:"Under the border exception for minors, what are the distance limits?",o:["Player and club each within 50 km of the border; max 100 km between home and club","Both within 100 km of the border","Max 50 km between home and club","Within 30 km of the border"],a:0,e:"Обидва в межах 50 км від кордону, максимальна відстань між домом і клубом — 100 км; гравець живе вдома, обидві асоціації дають згоду.",r:"RSTP ст. 19 п. 2 c)"},
{t:"RSTP",q:"Which body must approve the international transfer of a minor aged 10 or older?",o:["Players' Status Chamber of the Football Tribunal","Dispute Resolution Chamber","FIFA Council","The national association alone"],a:0,e:"Для гравця від 10 років схвалення дає Players' Status Chamber ще до запиту ITC.",r:"RSTP ст. 19 пп. 4–5"},
{t:"RSTP",q:"A player is transferred for EUR 10 million. Club X trained him in the calendar years of his 16th, 17th and 18th birthdays. What solidarity contribution does Club X receive?",o:["EUR 150,000","EUR 500,000","EUR 75,000","EUR 300,000"],a:0,e:"Солідарність — 5% (500 000). Роки 16–23: по 10% від цих 5% за рік → 3 × 10% × 500 000 = 150 000. Роки 12–15: по 5%.",r:"RSTP Annexe 5 ст. 1"},
{t:"RSTP",q:"Training compensation is NOT due when:",o:["The player is transferred to a category 4 club","A player registers as a professional for the first time","A 22-year-old professional moves between two associations","A professional moves internationally at the end of his contract aged 20"],a:0,e:"Не сплачується: якщо колишній клуб розірвав контракт без just cause; перехід до клубу 4-ї категорії; повернення до аматорського статусу.",r:"RSTP Annexe 4 ст. 2 п. 2"},
{t:"RSTP",q:"How are training costs calculated for the calendar years of a player's 12th to 15th birthdays?",o:["Based on category 4 club costs","Based on the new club's category","Based on the average of both clubs","Not counted"],a:0,e:"Щоб не завищувати компенсацію, роки 12–15 рахують за витратами клубів 4-ї категорії.",r:"RSTP Annexe 4 ст. 5 п. 3"},
{t:"RSTP",q:"Within the EU/EEA, for the former club to keep its right to training compensation, it must offer the player a contract:",o:["In writing at least 60 days before expiry, of at least equivalent value","At any time before expiry","At least 30 days before expiry, of any value","Only if the player is under 21"],a:0,e:"Письмова пропозиція щонайменше за 60 днів до закінчення контракту, не гірша за поточний контракт.",r:"RSTP Annexe 4 ст. 6 п. 3"},
{t:"RSTP",q:"A club terminated a player's contract without just cause due to overdue payables. The player signed a new contract. What compensation is due as a general rule?",o:["Residual value minus new contract value, plus three monthly salaries (up to six if egregious)","Full residual value only","Six monthly salaries in all cases","Only the overdue salaries"],a:0,e:"Mitigated Compensation + Additional Compensation 3 місячні зарплати (до 6 за кричущих обставин), але не більше залишкової вартості контракту.",r:"RSTP ст. 17 п. 1 ii"},
{t:"RSTP",q:"A contract gives the club a 20-day 'grace period' to pay salaries that have fallen due. This clause is:",o:["Not recognised, unless contained in a valid collective bargaining agreement","Always valid","Valid if signed by the player","Valid for up to 30 days"],a:0,e:"Grace periods не визнаються, окрім передбачених у колективних договорах.",r:"RSTP ст. 18 п. 6"},
{t:"RSTP",q:"May a contract be unilaterally terminated during a competition period?",o:["No","Yes, at any time with just cause given within 15 days","Yes, if the player is out of the protected period","Yes, with FIFA approval"],a:0,e:"Одностороннє розірвання протягом змагального періоду заборонено (ст. 16); just cause за ст. 14 — окрема підстава.",r:"RSTP ст. 16"},
// ===== Statutes / Ethics / Disciplinary =====
{t:"Статут, етика, дисципліна",q:"Within what time limit must an appeal against a final FIFA decision be lodged with CAS?",o:["21 days of receipt of the decision","10 days","30 days","60 days"],a:0,e:"Апеляція до CAS — протягом 21 дня після отримання рішення, після вичерпання внутрішніх механізмів.",r:"Статут FIFA ст. 50 п. 1"},
{t:"Статут, етика, дисципліна",q:"Which are the chambers of the FIFA Football Tribunal?",o:["Dispute Resolution Chamber, Players' Status Chamber, Agents Chamber","Disciplinary, Ethics and Appeal Chambers","Investigatory and Adjudicatory Chambers","Clubs, Players and Agents Chambers"],a:0,e:"Football Tribunal складається з трьох палат: DRC, PSC та Agents Chamber.",r:"Статут FIFA ст. 48 п. 1"},
{t:"Статут, етика, дисципліна",q:"CAS does NOT deal with appeals arising from:",o:["Suspensions of up to four matches or up to three months (except doping)","Decisions of the Agents Chamber","Decisions of the Appeal Committee","Training compensation decisions"],a:0,e:"CAS не розглядає: порушення Правил гри; дискваліфікації до 4 матчів або 3 місяців (крім допінгу); рішення про визнання національної DRC; справи, де є інший незалежний арбітраж.",r:"Статут FIFA ст. 50 п. 3"},
{t:"Статут, етика, дисципліна",q:"Under the FIFA Code of Ethics, what is the limitation period for prosecuting bribery and corruption?",o:["Ten years","Five years","No limitation","Two years"],a:0,e:"Загальне правило — 5 років; хабарництво/корупція і розкрадання коштів — 10 років; ст. 24 (погрози, сексуальне насильство, домагання) — без строку давності.",r:"Кодекс етики ст. 13"},
{t:"Статут, етика, дисципліна",q:"Under the FIFA Code of Ethics, which offences are NOT subject to any limitation period?",o:["Threats, coercion and all forms of sexual abuse, harassment and exploitation","Bribery and corruption","Misappropriation of funds","Conflicts of interest"],a:0,e:"Порушення статті 24 (захист фізичної та психічної цілісності) не мають строку давності.",r:"Кодекс етики ст. 13 п. 3"},
{t:"Статут, етика, дисципліна",q:"Into which chambers is the FIFA Ethics Committee divided?",o:["Investigatory chamber and adjudicatory chamber","First instance and appeal chambers","Players' and agents' chambers","Prosecution and defence chambers"],a:0,e:"Комітет з етики має слідчу та вирішальну палати.",r:"Статут FIFA ст. 46 п. 1"},
{t:"Статут, етика, дисципліна",q:"Under the FIFA Disciplinary Code, what is the general limitation period for prosecuting offences (other than match infringements and doping)?",o:["Five years","Two years","Ten years","Three years"],a:0,e:"Порушення під час матчу — 2 роки; допінг — 10 років; усі інші — 5 років.",r:"Дисциплінарний кодекс ст. 10"},
{t:"Статут, етика, дисципліна",q:"Under the FIFA Disciplinary Code, what is the general range of fines?",o:["CHF 100 to CHF 1,000,000","CHF 1,000 to CHF 100,000","CHF 500 to CHF 5,000,000","No limits"],a:0,e:"Загалом штрафи не менше CHF 100 і не більше CHF 1 000 000.",r:"Дисциплінарний кодекс ст. 6 п. 4"},
{t:"Статут, етика, дисципліна",q:"A club fails to pay an amount ordered by a FIFA decision. After the final deadline expires, what measure will be issued?",o:["A ban on registering new players until the amount is paid","Immediate relegation","Expulsion from the association","A warning"],a:0,e:"Клубу накладають заборону на реєстрацію. Зняття очок/пониження можливі, якщо заборона діяла понад три повні послідовні реєстраційні періоди, при повторних чи серйозних порушеннях.",r:"Дисциплінарний кодекс ст. 21 п. 1 d)"},
{t:"Статут, етика, дисципліна",q:"A FIFA judicial body notifies the terms of its decision without grounds. Within how many days must a party request a motivated decision?",o:["Ten days","Three days","21 days","Five days"],a:0,e:"10 днів на запит мотивованого рішення; інакше рішення стає остаточним, а право на апеляцію втрачається.",r:"Дисциплінарний кодекс ст. 54 п. 3"},
{t:"Статут, етика, дисципліна",q:"How many times may a player request to change the association for which he is eligible to play?",o:["Only once","Twice","Unlimited, until he plays an 'A' match","Never after age 21"],a:0,e:"Змінити асоціацію можна лише один раз.",r:"Правила застосування Статуту ст. 10 п. 1"},
{t:"Статут, етика, дисципліна",q:"Which FIFA body may impose sanctions on football agents under the FIFA Disciplinary Code?",o:["The Disciplinary Committee","The Council","The Congress","The general secretariat alone"],a:0,e:"Disciplinary Committee може застосовувати санкції до асоціацій, клубів, офіційних осіб, гравців, футбольних агентів і матч-агентів.",r:"Статут FIFA ст. 45 п. 2; FFAR ст. 21"}
];

// FFAR 0-32
"Строк обмежили, щоб гравець не «застрягав» з агентом надовго. Після 2 років сторони можуть лише підписати нову угоду. 3 і 5 років — пастки: 3 роки — це максимум контракту для гравця до 18 років (RSTP), 5 років — максимум трудового контракту. «Без обмежень» стосується тільки угод агента з клубами.",
"Обмеження у 2 роки захищає саме Individual (гравця чи тренера), бо він слабша сторона. Клуб — професійний учасник ринку, тому з ним строк не обмежено. Агент може мати з одним клубом кілька угод одночасно, якщо вони стосуються різних трансферів (ст. 12 п. 6).",
"Правило жорстке: будь-що, що продовжує угоду понад 2 роки, нікчемне. Підпис гравця, схвалення асоціації чи вік нічого не змінюють. Щоб працювати далі, потрібна нова угода, і перед нею агент знову має порадити гравцю незалежну юридичну консультацію.",
"Логіка: гравець і клуб, що його купує, мають спільний інтерес — укласти контракт. Інтереси клубу-продавця (Releasing Entity) протилежні: він хоче більше грошей і зберегти гравця. Тому дозволена лише одна комбінація: гравець + Engaging Entity, і лише за попередньою, явною і письмовою згодою обох. Згода «потім» або усна не підходить.",
"Releasing Entity продає гравця, тож її інтереси конфліктують і з гравцем, і з клубом-покупцем. Тому будь-яка комбінація з клубом-продавцем заборонена. Дозволена тільки пара гравець + Engaging Entity (ст. 12 п. 8).",
"Пов'язаність визначається не агенцією, а стосунками: брати/сестри — пов'язані агенти незалежно від місця роботи. Пов'язані агенти вважаються «однією стороною», тому для них діють ті самі обмеження, що й для одного агента. Клуб-продавець + гравець заборонені навіть зі згодою, а Clearing House тут ні до чого.",
"Список у визначенні вичерпний: спільна агенція (працівники, директори, акціонери, співвласники), шлюб або цивільне партнерство, брати й сестри, батьки й діти чи пасинки, а також домовленості про співпрацю чи розподіл доходу більше ніж один раз. Двоюрідних братів у списку немає, тож самі по собі вони не роблять агентів пов'язаними.",
"Інший агент не може ні контактувати (Approach), ні підписувати угоду з гравцем, поки діє ексклюзивна угода, окрім останніх 2 місяців. Якщо угода закінчується 30 червня, вікно відкривається з 1 травня. 6 місяців — пастка з RSTP (гравець вільний домовлятися з іншим клубом за 6 місяців до кінця контракту). І неважливо, хто ініціював контакт.",
"Дві умови разом: (1) не раніше ніж за 6 місяців до віку першого професійного контракту за законом країни, де гравець працюватиме; (2) попередня письмова згода законного представника. Якщо перший профконтракт можливий у 16, контакт — не раніше 15,5 років. Згода батьків без часової межі не дозволяє контактувати раніше.",
"Захист неповнолітніх — пріоритет FIFA, тому FFAR прямо встановлює мінімум: штраф і призупинення ліцензії до 2 років. «Лише попередження» чи «лише штраф» менші за мінімум. Остаточне позбавлення ліцензії не є мінімальною санкцією.",
"Ще до першої угоди з неповнолітнім (або до роботи на клуб у трансфері неповнолітнього) агент має пройти спеціальний курс CPD щодо неповнолітніх і виконати національні вимоги. Окремого іспиту чи національної ліцензії FFAR не вимагає, але й самої ліцензії FIFA недостатньо.",
"Порядок розрахунку: (1) знайди річну Remuneration гравця без умовних виплат; (2) якщо вона до 200 000 включно, ліміт 5% для гравця або клубу-покупця. 150 000 × 5% = 7 500. 4 500 — це 3% (ставка тільки для частини понад 200 000), 15 000 — 10% (ставка подвійного представництва), 9 000 — 6%.",
"Ставки діють «сходинками», як податок: перші 200 000 за ставкою 5%, лише надлишок понад 200 000 — за 3%. 200 000 × 5% = 10 000; (500 000 − 200 000) = 300 000 × 3% = 9 000; разом 19 000. Помилка «15 000» виникає, коли рахують 3% від усієї суми, «25 000» — коли 5% від усієї суми.",
"Так само сходинками, але ставки подвоєні: 10% до 200 000 і 6% на надлишок. 200 000 × 10% = 20 000; 800 000 × 6% = 48 000; разом 68 000. Типові помилки: 6% від усього мільйона = 60 000; 10% від усього = 100 000; 38 000 — якщо взяти ставки для одного клієнта (5% і 3%) замість подвоєних.",
"Коли агент працює на клуб-продавця, база — не зарплата гравця, а трансферна компенсація, ставка — 10%. З бази виключають: (1) компенсацію за порушення контракту за ст. 17 RSTP і (2) будь-які sell-on. 5 млн × 10% = 500 000. Ставка 3% стосується тільки зарплати понад 200 000, а не трансферу.",
"Головне правило — платить лише власний клієнт агента. Єдиний виняток для гравців із невеликою зарплатою: менше 200 000 на рік без умовних виплат. Тоді клуб-покупець може заплатити агенту гравця, але не більше, ніж у угоді, не утримуючи це з зарплати гравця, і без залежності агента від клубу. Самої згоди гравця для цього замало.",
"При подвійному представництві агент працює на двох клієнтів, тому кожен оплачує свою частину. Клуб-покупець може сплатити не більше половини загальної суми, решту — гравець. 100% від клубу означало б, що агент фактично працює на клуб.",
"Комісію платять не наперед, а розтягнуто: після закриття реєстраційного періоду, частинами кожні 3 місяці, поки діє контракт. До того ж рахується тільки реально отримана гравцем зарплата (пропорційно). Якщо контракт коротший за 6 місяців — один платіж після його закінчення.",
"Це правило проти обходу ліміту. Якщо агент чи пов'язаний з ним агент за 24 місяці до або після угоди надає «інші послуги» клієнту з цієї угоди, вважається, що це частина агентських послуг. Тоді гроші за них додаються до комісії і мусять уміститися в ліміт. Спростувати можна, але тягар доказу на агенті/клієнті. 18 місяців — у межах 24.",
"Майже всі строки звітності на Platform — 14 днів: підписання, зміна чи розірвання угоди, інші угоди з клієнтом, оплата комісії, домовленості між агентами, зміни щодо критеріїв допуску. 30 днів — лише для змін у даних про агенцію. 60 і 90 днів — строки з інших статей (виправлення порушень і сплата внеску).",
"Послідовність: заявка → перевірка критеріїв → іспит → сплата річного внеску протягом 90 днів. Не сплатив — заявка автоматично анулюється, і доведеться проходити все спочатку. 60 днів — строк на виправлення порушень за ст. 17.",
"Для «технічних» порушень (внесок, CPD, звітність) — двоступенево: спочатку автоматичне тимчасове призупинення, потім 60 днів на виправлення, і лише якщо не виправив — відкликання. Якщо ж агент перестав відповідати критеріям допуску, справу передають Дисциплінарному комітету.",
"Строки ст. 5 запам'ятовуй парами: беттінг — 12 місяців; робота без ліцензії — 24 місяці; банкрутство — 5 років; відсторонення — 2 роки чи більше. Беттінг 6 місяців тому < 12 → не допускають. Банкрутство 7 років тому > 5 → ок. Відсторонення 18 місяців < 2 років → ок. Юрист може бути агентом.",
"П'ять обов'язкових елементів: імена сторін, строк (якщо застосовно), сума комісії, характер послуг, підписи. Без будь-якого з них угода недійсна. Застосовне право — не обов'язкова умова, хоча на практиці його часто вказують.",
"FIFA гарантує гравцю право домовлятися самостійно. Нікчемні як обмеження такого права, так і штрафи за нього. Ексклюзивність, розмір штрафу чи юридична консультація цього не змінюють. Ексклюзивність означає лише, що інший агент не може втрутитися.",
"Агент мусить: (а) письмово поінформувати гравця, що варто отримати незалежну юридичну пораду; (б) отримати письмове підтвердження, що гравець її отримав або вирішив не отримувати. Це роблять і перед підписанням, і перед зміною угоди. Нотаріус, клуб чи попередня реєстрація в асоціації не потрібні.",
"Remuneration = базова зарплата + sign-on fee + умовні виплати (бонуси). Не входять: немонетарні вигоди (авто, житло, телефон) і майбутні трансферні виплати. Нюанс: щоб визначити, чи зарплата до або понад 200 000, умовні виплати НЕ враховують (ст. 15 п. a).",
"Для угод з міжнародним виміром — Agents Chamber Football Tribunal, строк 2 роки від події, і його перевіряють автоматично (ex officio). Звичайний суд гравцю чи агенту не закритий. DRC — для спорів клуб/гравець; CAS — апеляція, а не перша інстанція.",
"Ліцензія безстрокова (але може бути призупинена чи відкликана за ст. 17), особиста — її не можна передати агенції, і діє в усьому світі. Підтримувати її треба щорічним внеском і CPD, а не повторним іспитом.",
"Інтерес в агенції заборонено мати: клієнтам; особам, які самі не відповідають критеріям ст. 5; тим, хто володіє правами на гравців у порушення ст. 18bis/18ter RSTP. Клієнт-власник агенції — це прямий конфлікт інтересів. Сторонній фонд, банк чи дружина-не-клієнт не заборонені.",
"Агент отримує комісію частинами, поки діє контракт. Якщо гравець переходить в інший клуб до кінця контракту, майбутні частини «згорають». Те саме, якщо гравець сам розірвав контракт без поважної причини, коли агент ще його представляв. Новий клуб і клуб-продавець ці частини не сплачують.",
"Якщо угода не має міжнародного виміру, діють національні правила асоціації, де клієнт зареєстрований або проживає на момент підписання угоди. Національні правила мусять включати ст. 11–21 FFAR, тому базові правила ті самі.",
"Неповнолітній може мати агента (за умов ст. 13), але агент заробляє лише тоді, коли гравець підписує перший або наступний професійний контракт. До цього — жодних винагород, навіть зі згодою батьків.",
// RSTP 33-56
"Ключ — вік на момент підписання контракту, а не зараз. До 28-го дня народження → 3 повні сезони або 3 роки; від 28 → 2 сезони або 2 роки (що настане раніше). У 26 — перший варіант. Захищений період починається знову, якщо при продовженні подовжують строк контракту.",
"Санкція для гравця — заборона грати в офіційних матчах: 4 місяці, а при обтяжувальних обставинах 6. Вона набирає чинності з повідомлення і «заморожується» на міжсезоння. Заборона на 2 реєстраційні періоди — санкція для клубу. Після захищеного періоду спортивних санкцій немає, тільки компенсація.",
"Клубу забороняють реєструвати нових гравців (і національно, і міжнародно) на два повні послідовні реєстраційні періоди. Виняток ст. 6 п. 3 (реєстрація поза вікном) не можна використати. Нова редакція: клуб гравця карають лише якщо доведено, що він спонукав до порушення.",
"Загальний максимум — 5 років, але гравцям до 18 — не більше 3 років; довші положення не визнаються. «До 18 років» — пастка: обмеження стосується строку, а не віку завершення.",
"Дві умови: (1) гравець вільний підписати новий контракт, коли поточний закінчився або закінчиться протягом 6 місяців; (2) клуб, що хоче вести переговори, має спершу письмово повідомити поточний клуб. Реєструвати ж можна лише у реєстраційний період.",
"Контракт не можна робити залежним від медогляду або дозволу на роботу — клуб має перевіряти це до підписання. Інакше клуб міг би відмовитися від гравця пізніше, а гравець лишився б без роботи.",
"Три умови: (1) клуб не сплатив щонайменше 2 місячні зарплати; (2) гравець письмово повідомив про заборгованість; (3) дав щонайменше 15 днів на погашення. Якщо клуб не заплатив — є just cause. Строк 10 днів — пастка з ст. 12bis (санкції щодо клубу).",
"Sporting just cause: «встановлений професіонал» зіграв менше 10% офіційних матчів клубу за сезон. Розірвати можна тільки протягом 15 днів після останнього офіційного матчу сезону. Спортивних санкцій немає, але компенсацію можуть стягнути. 8% < 10% → підстава є.",
"Перше вікно (між сезонами): 8–12 тижнів; друге (посеред сезону): 4–8 тижнів; разом не більше 16. Дати вносять у TMS щонайменше за 12 місяців. Поза вікнами реєструють лише у винятках ст. 6 п. 3.",
"Оренда: мінімум — проміжок між двома реєстраційними періодами, максимум — 1 рік. Дата закінчення має припадати на реєстраційний період асоціації клубу-власника. Продовжити можна в тих самих межах і зі згодою гравця. Довші строки не визнаються.",
"Ліміти з 1 липня 2024: загалом до 6 гравців в оренді «назовні» і до 6 «всередину», але до одного конкретного клубу — до 3 в кожен бік. Загальний ліміт 6 не діє для гравців до 21, вихованих клубом, а обмеження «3 на один клуб» діє завжди.",
"Клуб-орендар не може ні передати гравця в суборенду, ні продати його. Згода гравця чи клубу-власника цього не змінює. Мета — не допустити «торгівлі» гравцями і схем bridge transfer.",
"Bridge transfer — фіктивний проміжний перехід через третій клуб (наприклад, для ухилення від податків або солідарних виплат). Якщо той самий гравець пройшов два трансфери поспіль протягом 16 тижнів, це презумується, доки сторони не доведуть протилежне.",
"Для санкцій щодо клубу за ст. 12bis: прострочка понад 30 днів без договірної підстави, і кредитор письмово дав щонайменше 10 днів на оплату. Не плутай зі ст. 14bis: там 2 місячні зарплати і 15 днів, а наслідок — право гравця розірвати контракт.",
"Головне правило: міжнародні трансфери лише після 18. Виняток 16–18 діє, тільки якщо трансфер всередині ЄС/ЄЄЗ або між асоціаціями однієї країни. Україна не в ЄС/ЄЄЗ, тож цей виняток не підходить. Інші винятки: переїзд батьків не через футбол, правило 50/100 км, біженці, обмін студентів. Для України також є тимчасовий Annexe 7.",
"Обидва — гравець і клуб — у межах 50 км від спільного кордону, але відстань між домом і клубом не більше 100 км. Гравець живе вдома, обидві асоціації дають явну згоду. Усі умови мають виконуватися одночасно.",
"Для гравців від 10 років на міжнародний трансфер або першу реєстрацію іноземця потрібне схвалення Players' Status Chamber (PSC) — до запиту ITC. Не плутай з DRC: вона вирішує спори, а не схвалює трансфери.",
"Покроково: (1) 5% від трансферу = 500 000 (це весь «солідарний фонд»); (2) за кожен рік 16–23 клуб отримує 10% фонду, за роки 12–15 — по 5%. Три роки (16, 17, 18) = 30% від 500 000 = 150 000. «500 000» — весь фонд, «75 000» — якщо взяти ставку 5% для молодших років.",
"Компенсація за навчання не сплачується, якщо: (1) колишній клуб розірвав контракт без just cause; (2) гравець переходить до клубу 4-ї категорії (найнижчої); (3) професіонал повертає аматорський статус. В інших варіантах вона належна: перша профреєстрація або міжнародний перехід до кінця року 23-річчя.",
"Щоб компенсація за найменших не була завищеною, роки 12–15 (чотири календарні роки) рахують за витратами клубів 4-ї категорії, незалежно від того, які клуби фактично брали участь. Решту років — за витратами нового клубу (в ЄС/ЄЄЗ — особливі правила).",
"Особливість ЄС/ЄЄЗ: якщо клуб-вихователь не запропонував контракт, компенсації немає (якщо не доведе своє право). Пропозиція — письмово (рекомендованим листом або e-mail з підтвердженням), щонайменше за 60 днів до закінчення, не гірша за поточний контракт.",

{t:"FFAR",c:"elig",q:"Which of the following conduct is prohibited for a Football Agent?",o:["Making media statements aimed at inducing a player to terminate his contract without just cause","Accepting payment of training compensation from a transfer","Failing to inform a Client of a written offer","Immediately informing a Client of a written offer received"],a:[0,1,2],e:"Заборонено: спонукати до порушення контракту (включно із заявами в ЗМІ), отримувати трансферні виплати чи компенсацію за навчання, приховувати пропозиції.",r:"FFAR ст. 16 пп. 3–4",
tq:"Яка поведінка заборонена футбольному агенту?",to:["Заяви в ЗМІ, щоб спонукати гравця розірвати контракт без поважної причини","Отримання компенсації за навчання з трансферу","Неповідомлення клієнта про письмову пропозицію","Негайне повідомлення клієнта про отриману письмову пропозицію"],
d:"A — ст. 16 п. 3 a), заяви в ЗМІ прямо названі. B — п. 3 e): агент не може отримувати трансферну компенсацію чи training reward. C — п. 3 c) ii, приховування суттєвих фактів. D — навпаки, обов'язок агента (п. 4 a)."},
{t:"FFAR",c:"rep",q:"Which of the following must an agent upload to the Platform within 14 days?",o:["A newly executed Representation Agreement","A settlement agreement entered into with a Client","An arrangement with another agent to share revenue","Changes to previously provided information about their Agency"],a:[0,1,2],e:"14 днів — угоди, мирові угоди, домовленості між агентами; 30 днів — зміни щодо агенції.",r:"FFAR ст. 16 п. 2 j)–k)",
tq:"Що з наведеного агент має завантажити на Platform протягом 14 днів?",to:["Щойно підписану угоду про представництво","Мирову угоду з клієнтом","Домовленість з іншим агентом про розподіл доходу","Зміни раніше наданої інформації про агенцію"],
d:"A, B, C — усе з п. j): 14 днів від підписання чи настання. D — пастка: дані про агенцію подають протягом 14 днів після першої угоди, а зміни в них — протягом 30 днів (п. k) iii)."},
{t:"FFAR",c:"pay",q:"A player's annual Remuneration is USD 150,000. The Engaging Entity agrees to pay the player's agent on his behalf. Which conditions must be met?",o:["The payment must be no higher than the fee agreed in the Representation Agreement","The club may not deduct the payment from the player's Remuneration","The payment must not create dependency of the agent towards the club","The club must also be a Client of the agent"],a:[0,1,2],e:"Виняток (менше 200 000 USD): усі умови п. 3 a)–c) мають виконуватися одночасно.",r:"FFAR ст. 14 п. 3",
tq:"Річна Remuneration гравця — 150 000 USD. Клуб-покупець погоджується заплатити агенту гравця за нього. Які умови мають виконуватися?",to:["Оплата не більша за винагороду з угоди про представництво","Клуб не може утримати цю суму з Remuneration гравця","Оплата не повинна створювати залежності агента від клубу","Клуб також має бути клієнтом агента"],
d:"A, B, C — три умови ст. 14 п. 3 a)–c), і всі мають виконуватися разом. D — не вимога: тут агент працює лише на гравця, а клуб платить від його імені. Якщо клуб теж клієнт — це вже подвійне представництво з іншими правилами."},
{t:"FFAR",c:"minA",q:"A Representation Agreement between a Football Agent and a minor is enforceable only where:",o:["It meets the minimum requirements of article 12 paragraph 7","It is signed by the minor and their legal guardian as required by applicable law","The agent completed the CPD course on minors and respected the rules on Approach","It is approved in advance by FIFA"],a:[0,1,2],e:"Три умови ст. 13 п. 3: мінімальні вимоги, дотримання пп. 1–2 (контакт і курс), підписи неповнолітнього і представника.",r:"FFAR ст. 13 п. 3",
tq:"Угода про представництво між агентом і неповнолітнім має юридичну силу лише якщо:",to:["Вона відповідає мінімальним вимогам ст. 12 п. 7","Її підписали неповнолітній і законний представник відповідно до закону","Агент пройшов курс CPD щодо неповнолітніх і дотримався правил контакту","Її заздалегідь схвалила FIFA"],
d:"A, B, C — перелік ст. 13 п. 3. D — FIFA не схвалює угоди з агентами заздалегідь; схвалення Players' Status Chamber стосується трансферу неповнолітнього, а не угоди з агентом."},
{t:"FFAR",c:"ra",q:"Which of the following constitute just cause to terminate a Representation Agreement under the FFAR?",o:["Withdrawal or suspension of the agent's licence","A ban on the agent taking part in any football-related activity","A ban on the club registering new players for at least one entire registration period","The agent negotiating a lower salary than the player expected"],a:[0,1,2],e:"Ст. 12 п. 14 прямо називає ці три ситуації як just cause (перелік невичерпний).",r:"FFAR ст. 12 п. 14",
tq:"Що з наведеного є поважною причиною для розірвання угоди про представництво за FFAR?",to:["Відкликання або призупинення ліцензії агента","Заборона агенту займатися будь-якою футбольною діяльністю","Заборона клубу реєструвати нових гравців щонайменше на один повний реєстраційний період","Агент домовився про нижчу зарплату, ніж очікував гравець"],
d:"A, B, C — три приклади з ст. 12 п. 14 a)–c). D — незадоволеність результатом сама по собі не робить продовження неможливим за принципом добросовісності; розірвання з такої причини означало б компенсацію збитків іншій стороні."},
{t:"FFAR",c:"rep",q:"Which of the following will FIFA make available under article 19 of the FFAR?",o:["The names and details of all Football Agents","The Clients that agents represent and the expiry date of the Representation Agreement","Any sanctions imposed on Football Agents and Clients","Service fee amounts paid to Football Agents in Transactions"],a:[0,1,2,3],e:"Усі чотири пункти є в ст. 19: агенти, клієнти й ексклюзивність, послуги, санкції, угоди з сумами винагород.",r:"FFAR ст. 19",
tq:"Що з наведеного FIFA оприлюднює за ст. 19 FFAR?",to:["Імена та дані всіх футбольних агентів","Клієнтів агентів і дату закінчення угоди про представництво","Будь-які санкції щодо агентів і клієнтів","Суми винагород, сплачених агентам в угодах"],
d:"Правильні всі чотири — прозорість одна з цілей реформи. Тут чотири правильні відповіді: на іспиті таке теж буває, тому не шукай обов'язково «зайвий» варіант."},
{t:"FFAR",c:"elig",q:"Which of the following is prohibited conduct for Clients under the FFAR?",o:["Engaging an unlicensed person to perform Football Agent Services","A club interfering with a player's freedom to select a Football Agent","Paying the agent the service fee agreed in the Representation Agreement","Holding an Interest in an Agency"],a:[0,1,3],e:"Клієнтам заборонено наймати неліцензованих осіб, впливати на вибір агента гравцем, мати інтерес в агенції тощо.",r:"FFAR ст. 18 п. 2",
tq:"Яка поведінка заборонена клієнтам за FFAR?",to:["Залучати неліцензовану особу для агентських послуг","Втручання клубу у свободу гравця обирати агента","Сплата агенту винагороди, погодженої в угоді","Володіння інтересом в агенції"],
d:"A — ст. 18 п. 2 a). B — п. 2 d), стосується асоціацій, клубів і ліг. D — п. 2 f). C — навпаки, обов'язок клієнта (п. 1 b)); заборонено давати агенту щось понад погоджену винагороду (п. 2 c))."},
// RSTP
{t:"RSTP",c:"minT",q:"Which of the following are exceptions allowing the international transfer of a minor?",o:["The player's parents move to the new club's country for reasons not linked to football","The player is aged 16–18 and the transfer takes place within the EU/EEA","The new club offers the player's family a well-paid job","The player lives within 50 km of the border and the club is within 50 km on the other side"],a:[0,1,3],e:"Винятки ст. 19 п. 2: переїзд батьків не через футбол, 16–18 у ЄС/ЄЄЗ, прикордонне правило, біженці, обмін студентів.",r:"RSTP ст. 19 п. 2",
tq:"Що з наведеного є винятками, що дозволяють міжнародний трансфер неповнолітнього?",to:["Батьки гравця переїжджають до країни нового клубу з причин, не пов'язаних з футболом","Гравцю 16–18 років, і трансфер відбувається в межах ЄС/ЄЄЗ","Новий клуб пропонує родині гравця добре оплачувану роботу","Гравець живе в межах 50 км від кордону, а клуб — в межах 50 км по інший бік"],
d:"A — виняток a). B — виняток b). D — виняток c) (додатково: не більше 100 км між домом і клубом). C — класична заборонена схема: якщо батьки переїжджають через роботу, яку дав клуб, переїзд пов'язаний з футболом."},
{t:"RSTP",c:"reg",q:"In which cases may a professional be registered outside a registration period?",o:["He unilaterally terminated his contract with just cause","His contract expired before the end of the engaging club's registration period","He wants to move because of a lack of playing time","She temporarily replaces a female player on maternity leave"],a:[0,1,3],e:"Винятки ст. 6 п. 3: розірвання з just cause (або без just cause клубом), закінчення контракту до кінця вікна, заміна гравчині у декреті тощо.",r:"RSTP ст. 6 п. 3",
tq:"У яких випадках професіонала можна зареєструвати поза реєстраційним періодом?",to:["Він односторонньо розірвав контракт з поважною причиною","Його контракт закінчився до кінця реєстраційного періоду нового клубу","Він хоче перейти через брак ігрового часу","Вона тимчасово замінює гравчиню в декретній відпустці"],
d:"A — п. 3 a). B — п. 3 b). D — п. 3 c). C — бажання перейти не є підставою; навіть sporting just cause (ст. 15) передбачає розірвання в певний строк, а реєстрація — у звичайних межах."},
{t:"RSTP",c:"trn",q:"In which cases is training compensation NOT due?",o:["The player is transferred to a category 4 club","The former club terminated the player's contract without just cause","A professional reacquires amateur status on being transferred","The player is registered as a professional for the first time"],a:[0,1,2],e:"Annexe 4 ст. 2 п. 2: три випадки, коли компенсація не сплачується.",r:"RSTP Annexe 4 ст. 2 п. 2",
tq:"У яких випадках компенсація за навчання НЕ сплачується?",to:["Гравець переходить до клубу 4-ї категорії","Колишній клуб розірвав контракт гравця без поважної причини","Професіонал при переході повертає собі аматорський статус","Гравець уперше реєструється як професіонал"],
d:"A, B, C — повний перелік п. 2 a)–c). D — навпаки, одна з двох підстав, коли компенсація ПОТРІБНА (п. 1 a))."},
{t:"RSTP",c:"loan",q:"Which statements about the loan of professionals are correct?",o:["The maximum duration of a loan is one year","The new club may sub-loan the player with his consent","The contractual obligations with the former club are suspended unless otherwise agreed in writing","An extension of a loan requires the player's written consent"],a:[0,2,3],e:"Максимум рік; зобов'язання зі старим клубом призупинені; продовження — зі згоди гравця; суборенда заборонена.",r:"RSTP ст. 10 п. 1",
tq:"Які твердження про оренду професіоналів правильні?",to:["Максимальний строк оренди — один рік","Новий клуб може передати гравця в суборенду з його згоди","Зобов'язання за контрактом з колишнім клубом призупинені, якщо письмово не погоджено інше","Продовження оренди потребує письмової згоди гравця"],
d:"A — п. 1 d). C — п. 1 c). D — п. 1 e). B — суборенда заборонена абсолютно (п. 1 f)), згода гравця не допомагає."},
{t:"RSTP",c:"ctr",q:"Which of the following contractual provisions are not recognised or not permitted under the RSTP?",o:["Making the contract's validity conditional on a successful medical examination","A grace period for salary payments not contained in a collective bargaining agreement","A five-year contract for a 17-year-old player","The football agent's name and FIFA licence number in the contract"],a:[0,1,2],e:"Медогляд як умова — заборонено; grace periods — не визнаються; до 18 років — максимум 3 роки.",r:"RSTP ст. 18 пп. 2, 4, 6",
tq:"Які умови контракту не визнаються або не дозволені за RSTP?",to:["Чинність контракту залежить від успішного медогляду","Пільговий період для виплати зарплати, не передбачений колективним договором","П'ятирічний контракт для 17-річного гравця","Ім'я агента і номер його ліцензії FIFA в контракті"],
d:"A — ст. 18 п. 4. B — п. 6. C — п. 2: до 18 років максимум 3 роки, довше не визнається. D — навпаки, обов'язкова умова (ст. 18 п. 1, FFAR ст. 12 п. 11)."},
{t:"RSTP",c:"prot",q:"A 24-year-old player terminates his contract without just cause in the first season. Which consequences may follow?",o:["He must pay compensation","A four-month restriction on playing in official matches","His new club is banned from registering players, regardless of its involvement","His new club is jointly liable if it is established that it induced the breach"],a:[0,1,3],e:"Компенсація — завжди; у захищений період — 4 місяці без матчів; новий клуб відповідає, лише якщо доведено, що він спонукав.",r:"RSTP ст. 17 пп. 1–4",
tq:"24-річний гравець розірвав контракт без поважної причини в першому сезоні. Які наслідки можливі?",to:["Він має сплатити компенсацію","Чотири місяці без офіційних матчів","Новий клуб отримує заборону на реєстрацію незалежно від своєї участі","Новий клуб відповідає солідарно, якщо доведено, що він спонукав до порушення"],
d:"A — компенсація при будь-якому порушенні без поважної причини. B — порушення в захищений період (контракт до 28 років → 3 сезони). D — п. 2 і 4 в актуальній редакції: відповідальність нового клубу лише якщо доведено спонукання. C — неправильно саме через «незалежно від участі»."},
{t:"RSTP",c:"prot",q:"Which statements about the protected period are correct?",o:["If a contract is signed at age 30, it lasts two entire seasons or two years, whichever comes first","If the contract's duration is extended on renewal, the protected period starts again","After the protected period, a breach by the player always leads to sporting sanctions","If a contract is signed at age 25, it lasts three entire seasons or three years, whichever comes first"],a:[0,1,3],e:"До 28 — 3 сезони/3 роки, після 28 — 2/2; продовження строку перезапускає період; після нього спортивних санкцій немає.",r:"RSTP, Definitions п. 7; ст. 17 п. 3",
tq:"Які твердження про захищений період правильні?",to:["Якщо контракт підписано у 30 років, він триває два повні сезони або два роки, що настане раніше","Якщо при поновленні контракту його строк подовжено, захищений період починається знову","Після захищеного періоду порушення гравцем завжди тягне спортивні санкції","Якщо контракт підписано у 25 років, він триває три повні сезони або три роки, що настане раніше"],
d:"A і D — визначення п. 7. B — ст. 17 п. 3, останнє речення. C — навпаки: після захищеного періоду спортивних санкцій немає (лише дисциплінарні заходи, якщо гравець не повідомив про розірвання протягом 15 днів після останнього матчу)."},
{t:"RSTP",c:"jc",q:"Under article 14bis, which conditions must be met for a player to terminate for outstanding salaries?",o:["The club failed to pay at least two monthly salaries on their due dates","The player put the club in default in writing","The player granted a deadline of at least 15 days","The player obtained prior approval from FIFA"],a:[0,1,2],e:"Дві зарплати + письмова вимога + щонайменше 15 днів.",r:"RSTP ст. 14bis п. 1",
tq:"Які умови мають виконуватися за ст. 14bis, щоб гравець розірвав контракт через невиплату зарплати?",to:["Клуб не виплатив щонайменше дві місячні зарплати у строк","Гравець письмово повідомив клуб про заборгованість","Гравець дав щонайменше 15 днів на оплату","Гравець отримав попереднє схвалення FIFA"],
d:"A, B, C — три кумулятивні умови. D — схвалення FIFA не потрібне: гравець розриває контракт сам, а спір про наслідки може потім розглянути DRC."},
{t:"RSTP",c:"sol",q:"Which statements about the solidarity mechanism are correct?",o:["5% of the compensation is distributed as solidarity contribution","It covers clubs that registered the player between the calendar years of his 12th and 23rd birthdays","It applies only to national transfers","Training compensation paid to the former club is not included in the base"],a:[0,1,3],e:"5% від компенсації (без компенсації за навчання), розподіл за роки 12–23.",r:"RSTP ст. 21; Annexe 5 ст. 1",
tq:"Які твердження про механізм солідарності правильні?",to:["5% компенсації розподіляють як солідарний внесок","Він охоплює клуби, де гравець був зареєстрований у календарні роки від 12- до 23-річчя","Він застосовується лише до національних трансферів","Компенсація за навчання, сплачена колишньому клубу, не входить до бази"],
d:"A, B, D — Annexe 5 ст. 1 п. 1. C — неправильно: механізм діє для міжнародних трансферів і для національних з міжнародним виміром (коли клуб-вихователь з іншої асоціації); суто національні трансфери за загальним правилом не охоплюються."},
{t:"RSTP",c:"brg",q:"Which statements about bridge transfers are correct?",o:["They are presumed when two consecutive transfers of the same player occur within 16 weeks","The presumption applies to both national and international transfers","The presumption cannot be rebutted","Football Agents are prohibited from being involved in them"],a:[0,1,3],e:"Презумпція 16 тижнів для будь-яких трансферів, але її можна спростувати; агентам участь заборонена.",r:"RSTP ст. 5bis; FFAR ст. 16 п. 3 f)",
tq:"Які твердження про трансфери-містки (bridge transfer) правильні?",to:["Їх презумують, коли два послідовні трансфери одного гравця відбуваються протягом 16 тижнів","Презумпція діє і для національних, і для міжнародних трансферів","Презумпцію не можна спростувати","Футбольним агентам заборонено в них брати участь"],
d:"A і B — ст. 5bis п. 2 («national or international»). D — FFAR ст. 16 п. 3 f). C — неправильно: «unless established to the contrary» — сторони можуть довести, що це був справжній трансфер."},

o:["The maximum service fee is EUR 800,000","Club A pays R following receipt of each instalment of the transfer compensation","R may additionally receive 10% of any future sell-on payment","Club B may pay R's service fee on behalf of Club A"],a:[0,1],
e:"10% від 8 млн = 800 000; sell-on виключено з бази. Клуб-продавець платить після кожної отриманої частини. Платить лише клієнт.",
tq:"Агент R представляє клуб A (продавця) у трансфері гравця до клубу B за 8 млн євро чотирма щорічними платежами по 2 млн плюс 15% від наступного продажу. Які твердження правильні?",
to:["Максимальна винагорода — 800 000 євро","Клуб A платить R після отримання кожної частини трансферної компенсації","R може додатково отримати 10% від майбутнього sell-on","Клуб B може сплатити винагороду R замість клубу A"],
d:"A — 10% × 8 млн (ст. 15 п. 2). B — ст. 14 п. 11. C — sell-on прямо виключено з бази (п. 2 c) ii). D — ст. 14 п. 2: платить лише клієнт; виняток п. 3 стосується тільки оплати клубом-покупцем за гравця з невеликою зарплатою."},
{t:"FFAR",c:"jur",r:"FFAR ст. 2 п. 2; ст. 20 п. 1",
q:"A Brazilian player and a Portuguese agent signed a Representation Agreement covering the player's transfer from a Brazilian club to a Spanish club. A fee dispute arises from an event on 1 March 2025. Which of the following statements are correct?",
o:["The Agents Chamber of the Football Tribunal has jurisdiction, as the agreement has an international dimension","The claim must be lodged no later than two years after the event giving rise to the dispute","The parties are prohibited from bringing the dispute before an ordinary court","The Dispute Resolution Chamber is competent"],a:[0,1],
e:"Міжнародний трансфер → міжнародний вимір → Agents Chamber; строк 2 роки. Право на звичайний суд збережено.",
tq:"Бразильський гравець і португальський агент підписали угоду щодо переходу гравця з бразильського клубу до іспанського. Спір про винагороду виник через подію 1 березня 2025. Які твердження правильні?",
to:["Компетентна Палата агентів Football Tribunal, бо угода має міжнародний вимір","Позов треба подати не пізніше двох років від події, що спричинила спір","Сторонам заборонено звертатися до звичайного суду","Компетентна Палата з вирішення спорів (DRC)"],
d:"A — ст. 2 п. 2 a) + ст. 20 п. 1 a). B — ст. 20 п. 1 c), строк перевіряють ex officio. C — ст. 20 починається словами «Without prejudice to the right ... to seek redress before an ordinary court». D — DRC розглядає трудові спори клуб/гравець, а не спори з агентами."},
{t:"FFAR",c:"lic",r:"FFAR ст. 17 пп. 1, 4; ст. 12 п. 14 a)",
q:"A Football Agent fails to pay the annual licence fee by the deadline stipulated on the Platform. Which of the following statements are correct?",
o:["The licence is automatically provisionally suspended","If the agent does not rectify the non-compliance within 60 days of the suspension, the licence is withdrawn","The matter is automatically referred to the FIFA Disciplinary Committee for a decision","A client may terminate their Representation Agreement with just cause due to the suspension of the licence"],a:[0,1,3],
e:"Автоматичне тимчасове призупинення → 60 днів на виправлення → відкликання. Призупинення ліцензії — just cause для клієнта.",
tq:"Агент не сплатив річний ліцензійний внесок у строк, вказаний на Platform. Які твердження правильні?",
to:["Ліцензію автоматично тимчасово призупиняють","Якщо агент не виправить порушення за 60 днів від призупинення, ліцензію відкликають","Справу автоматично передають Дисциплінарному комітету FIFA","Клієнт може розірвати угоду про представництво з поважною причиною через призупинення ліцензії"],
d:"A — ст. 17 п. 1 b). B — п. 4 b). D — ст. 12 п. 14 a). C — пастка: до Дисциплінарного комітету передають лише випадки невідповідності критеріям допуску (п. 3), а для внеску, CPD і звітності діє механізм 60 днів (п. 4)."},
{t:"FFAR",c:"elig",r:"FFAR ст. 5 п. 1",
q:"Which of the following applicants satisfy the eligibility requirements on the day they submit their licence application?",
o:["A youth coach who resigned from his club one month before applying","A person who sold her shares in a sports-betting company ten months before applying","A person who was a director of a company that entered administration four years before applying","A former player who was suspended for 18 months by a sports governing body for breaching ethics rules"],a:[0,3],
e:"Не бути працівником клубу — на момент заявки. Беттінг — 12 місяців, банкрутство/адміністрація — 5 років, відсторонення — 2 роки і більше.",
tq:"Хто з кандидатів відповідає критеріям допуску в день подання заявки?",
to:["Дитячий тренер, що звільнився з клубу за місяць до заявки","Особа, що продала частку в беттінговій компанії за десять місяців до заявки","Особа, що була директором компанії, яка перейшла під зовнішнє управління за чотири роки до заявки","Колишній гравець, якого відсторонили на 18 місяців за порушення етики"],
d:"A — ст. 5 a) iv вимагає «not be an official or employee» на момент заявки; звільнення закриває питання. B — 10 < 12 місяців (d). C — 4 < 5 років (c), і це стосується не лише банкрутства, а й адміністрації чи ліквідації. D — 18 місяців < 2 років (a) iii, тож не перешкода."},
{t:"FFAR",c:"elig",r:"FFAR ст. 16 п. 3 c) ii; ст. 16 п. 4 a)",
q:"An agent receives a written offer for his player client from Club X via WhatsApp. Considering the offer too low, he does not pass it on. Which of the following statements are correct?",
o:["The agent breached his duty to immediately inform the client of any written offer","There is no breach, because a WhatsApp message is not a formal offer","Failing to report the offer constitutes concealing material facts from the client","There is a breach only if the client suffers financial loss"],a:[0,2],
e:"Обов'язок повідомляти про будь-яку письмову пропозицію «by any means of communication»; неповідомлення — приховування суттєвих фактів.",
tq:"Агент отримує через WhatsApp письмову пропозицію від клубу X для свого гравця. Вважаючи її замалою, він не передає її клієнту. Які твердження правильні?",
to:["Агент порушив обов'язок негайно інформувати клієнта про будь-яку письмову пропозицію","Порушення немає, бо повідомлення у WhatsApp — не офіційна пропозиція","Неповідомлення є приховуванням суттєвих фактів від клієнта","Порушення є, лише якщо клієнт зазнав фінансових втрат"],
d:"A — ст. 16 п. 4 a). C — п. 3 c) ii. B — у тексті прямо «by any means of communication». D — шкода не є умовою порушення; рішення приймає клієнт, а не агент."},
// RSTP
{t:"RSTP",c:"prot",r:"RSTP, Definitions п. 7; ст. 17 пп. 1, 3",
q:"Player Ruiz, born on 15 September 1997, signed a four-year contract that entered into force on 1 July 2025. On 1 August 2027 he terminates it without just cause. Which of the following statements are correct?",
o:["The breach occurs within the protected period","Ruiz faces a four-month restriction on playing in official matches (six with aggravating circumstances)","No sporting sanction applies, because Ruiz was 29 at the time of the breach","Ruiz must pay compensation"],a:[0,1,3],
e:"Вирішальний вік — на момент укладення контракту (27) → 3 сезони/3 роки. 1.08.2027 — у межах.",
tq:"Гравець Руїс, народжений 15 вересня 1997, підписав чотирирічний контракт, що набрав чинності 1 липня 2025. 1 серпня 2027 він розриває його без поважної причини. Які твердження правильні?",
to:["Порушення сталося в захищений період","Руїсу загрожує заборона грати в офіційних матчах на чотири місяці (шість при обтяжувальних обставинах)","Спортивна санкція не застосовується, бо на момент порушення Руїсу було 29","Руїс має сплатити компенсацію"],
