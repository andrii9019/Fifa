 into force shall not be affected by this prohibition.", "7. Female players are entitled to maternity, adoption and family leave during the term of their contract, paid at the equivalent of two thirds of their contracted salary. Where a validly negotiated collective bargaining agreement contains provisions related to maternity, adoption and/or family leave, the respective provisions of the collective bargaining agreement shall prevail. Where no collective bargaining agreement exists, but where more favourable conditions are stipulated pursuant to national law, these more favourable conditions shall prevail."]}, "RSTP:19": {"h": "Article 19: Protection of minors", "p": ["1. International transfers of players are only permitted if the player is over the age of 18.", "2. The following five exceptions to this rule apply:", "a) The player’s parents move to the country in which the new club is located for reasons not linked to football.", "b) The player is aged between 16 and 18 and:", "i. the transfer takes place within the territory of the European Union (EU) or European Economic Area (EEA); or", "ii. the transfer takes place between two associations within the same country. The new club must fulfil the following minimum obligations:", "iii. It shall provide the player with an adequate football education and/or training in line with the highest national standards (cf. Annexe 4, article 4).", "iv. It shall guarantee the player an academic and/or school and/or vocational education and/or training, in addition to his football education and/or training, which will allow the player to pursue a career other than football should he cease to play professional football.", "v. It shall make all necessary arrangements to ensure that the player is looked after in the best possible way (optimum living standards with a host family or in club accommodation, appointment of a mentor at the club, etc.).", "vi. It shall, on registration of such a player, provide the relevant association with proof that it is complying with the aforementioned obligations.", "c) The player lives no further than 50km from a national border and the club with which the player wishes to be registered in the neighbouring association is also within 50km of that border. The maximum distance between the player’s domicile and the club’s headquarters shall be 100km. In such cases, the player must continue to live at home and the two associations concerned must give their explicit consent.", "d) The player is at least temporarily permitted to reside in the country of arrival and/or is recognised by the competent state authorities as vulnerable and requiring state protection by the country of arrival after fleeing their country of origin (or previous country of domicile) for humanitarian reasons, without their parents, due to either of the following:", "i. their life or freedom being threatened on account of race, religion, nationality, belonging to a particular social group, or political opinion; or", "ii. any other circumstances where their survival is seriously threatened. If the minor has been formally recognised as a refugee or a protected person, they may be registered with a professional club or purely amateur club. There are no restrictions on any subsequent national transfer of the minor prior to their turning 18. If the minor has been formally recognised as asylum seeker or has been recognised by the competent state authorities as vulnerable in accordance with article 19 paragraph d) above, they may only be registered with a purely amateur club. They may be the subject of a subsequent national transfer, but are not permitted to register with a professional club until they turn 18.", "e) The player is a student and moves without his parents to another country temporarily for academic reasons in order to undertake an exchange programme. The duration of the player’s registration for the new club until he turns 18 or until the end of the academic or school programme cannot exceed one year. The player’s new club may only be a purely amateur club without a professional team or without a legal, financial or de facto link to a professional club.", "3. The provisions of this article shall also apply to any player who has never previously been registered with a club, is not a national of the country where the association at which he wishes to be registered for the first time is domiciled, and has not lived continuously for at least the last five years in said country.", "4. Where a minor player is at least ten years old, the Players’ Status Chamber of the Football Tribunal must approve:", "a) their international transfer according to paragraph 2;", "b) their first registration according to paragraph 3; or", "c) their first registration, where the minor player is not a national of the country where the association at which they wish to be registered is domiciled and has lived continuously for at least the last five years in that country.", "5. Approval pursuant to paragraph 4 is required prior to any request for an ITC and/or a first registration by an association.", "6. Where a minor player is under ten years old, it is the responsibility of the association that intends to register the player – as per the request of its affiliated club – to verify and ensure that the circumstances of the player fall, beyond all doubt, under one of the exceptions provided for in paragraph 2, 3, or 4 c). Such verification shall be made prior to any registration.", "7. An association may apply to the Players’ Status Chamber of the Football Tribunal for a limited minor exemption (“LME”).", "a) An LME, if granted, relieves an association, under specific terms and conditions and solely for amateur minor players who are to be registered with purely amateur clubs, from the application obligations set out in paragraph 4.", "b) In such a case, prior to any request for an ITC and/or a first registration, the association concerned is required to verify and ensure that the circumstances of the player fall, beyond all doubt, under one of the exceptions provided for in paragraph 2, 3, or 4 c).", "8. A club that has registered a minor player following a national transfer, international transfer or first registration shall: – owe a duty of care to the minor; – take any reasonable measures to protect and safeguard the minor from any possible abuse; and – ensure that the minor is provided with an opportunity to obtain an academic education (according to the highest national standards) that allows them to pursue a career other than football.", "9. The procedures for applying to the Players’ Status Chamber of the Football Tribunal for the matters described in this article are contained in the Procedural Rules Governing the Football Tribunal."]}, "RSTP:21": {"h": "Article 21: Solidarity mechanism", "p": ["If a professional is transferred before the expiry of his contract, any club that has contributed to his education and training shall receive a proportion of the compensation paid to his former club (solidarity contribution). The provisions concerning solidarity contributions are set out in Annexe 5 of these regulations."]}, "RSTP:A4": {"h": "Annexe 4: Training compensation", "p": ["1. A player’s training and education takes place between the ages of 12 and 23. Training compensation shall be payable, as a general rule, up to the age of 23 for training incurred up to the age of 21, unless it is evident that a player has already terminated his training period before the age of 21. In the latter case, training compensation shall be payable until the end of the calendar year in which the player reaches the age of 23, but the calculation of the amount payable shall be based on the years between the age of 12 and the age when it is established that the player actually completed his training.", "2. The obligation to pay training compensation is without prejudice to any obligation to pay compensation for breach of contract.", "2. Payment of training compensation", "1. Training compensation is due when:", "a) a player is registered for the first time as a professional; or", "b) a professional is transferred between clubs of two different associations (whether during or at the end of his contract) before the end of the calendar year of his 23rd birthday.", "2. Training compensation is not due if:", "a) the former club terminates the player’s contract without just cause (without prejudice to the rights of the previous clubs); or", "b) the player is transferred to a category 4 club; or", "c) a professional reacquires amateur status on being transferred.", "3. For cases governed by the FIFA Clearing House Regulations, payment of training compensation shall be made in accordance with the FIFA Clearing House Regulations.", "3. Responsibility to pay training compensation", "1. For cases not governed by the FIFA Clearing House Regulations, on registering as a professional for the first time, the club with which the player is registered is responsible for paying training compensation within 30 days of registration to every club with which the player has previously been registered (in accordance with the players’ career history as provided in the player passport) and that has contributed to his training starting from the calendar year of his 12th birthday. The amount payable is calculated on a pro rata basis according to the period of training that the player spent with each club. In the case of subsequent transfers of the professional, training compensation will only be owed to his former club for the time he was effectively trained by that club.", "2. In both of the above cases, for cases not governed by the FIFA Clearing House Regulations, the deadline for payment of training compensation is 30 days following the registration of the professional with the new association.", "3. An association is entitled to receive the training compensation which in principle would be due to one of its affiliated clubs, if it can provide evidence that the club in question – with which the professional was registered and trained – has in the meantime ceased to participate in organised football and/or no longer exists due to, in particular, bankruptcy, liquidation, dissolution or loss of affiliation. This compensation shall be reserved for youth football development programmes in the association(s) in question.", "4. Training costs", "1. In order to calculate the compensation due for training and education costs, associations are instructed to divide their clubs into a maximum of four categories in accordance with the clubs’ financial investment in training players. The training costs are set for each category and correspond to the amount needed to train one player for one year multiplied by an average “player factor”, which is the ratio of players who need to be trained to produce one professional player.", "2. The training costs, which are established on a confederation basis for each category of club, as well as the categorisation of clubs for each association, are published on the FIFA website (www.FIFA.com). They are updated at the end of every calendar year. Associations are required to keep the data regarding the training category of their clubs inserted in TMS up to date at all times (cf. Annexe 3).", "5. Calculation of training compensation", "1. As a general rule, to calculate the training compensation due to a player’s former club(s), it is necessary to take the costs that would have been incurred by the new club if it had trained the player itself.", "2. Accordingly, the first time a player registers as a professional, the training compensation payable is calculated by taking the training costs of the new club multiplied by the number of years of training, in principle from the calendar year of the player’s 12th birthday to the calendar year of his 21st birthday. In the case of subsequent transfers, training compensation is calculated based on the training costs of the new club multiplied by the number of years of training with the former club.", "3. To ensure that training compensation for very young players is not set at unreasonably high levels, the training costs for players for the calendar years of their 12th to 15th birthdays (i.e. four calendar years) shall be based on the training and education costs of category 4 clubs.", "4. The Dispute Resolution Chamber may review disputes concerning the amount of training compensation payable and shall have discretion to adjust this amount if it is clearly disproportionate to the case under review.", "6. Special provisions for the EU/EEA", "1. For players moving from one association to another inside the territory of the EU/EEA, the amount of training compensation payable shall be established based on the following:", "a) If the player moves from a lower to a higher category club, the calculation shall be based on the average training costs of the two clubs.", "b) If the player moves from a higher to a lower category, the calculation shall be based on the training costs of the lower-category club.", "2. Inside the EU/EEA, the final calendar year of training may occur before the calendar year of the player’s 21st birthday if it is established that the player completed his training before that time.", "3. If the former club does not offer the player a contract, no training compensation is payable unless the former club can justify that it is entitled to such compensation. The former club must offer the player a contract in writing via registered post at least 60 days before the expiry of his current contract, subject to the temporary exception below. Such an offer shall furthermore be at least of an equivalent value to the current contract. This provision is without prejudice to the right to training compensation of the player’s previous club(s).", "i. The contract offer may be made by electronic mail, provided that the former club obtains confirmation from the player that he has received a copy of said offer and can provide such confirmation in case of any dispute.", "7. Disciplinary measures The FIFA Disciplinary Committee may impose disciplinary measures on clubs or players that do not observe the obligations set out in this annexe."]}, "RSTP:A5": {"h": "Annexe 5: Solidarity mechanism, article 1", "p": ["1. If a professional moves during the course of a contract, 5% of any compensation paid within the scope of this transfer, not including training compensation paid to his former club, shall be deducted from the total amount of this compensation and distributed by the new club as a solidarity contribution to the club(s) involved in his training and education over the years. This solidarity contribution reflects the number of years (calculated pro rata if less than one year) he was registered with the relevant club(s) between the calendar years of his 12th and 23rd birthdays, as follows:", "a) Calendar year of 12th birthday: 5% of 5% of any compensation", "b) Calendar year of 13th birthday: 5% of 5% of any compensation", "c) Calendar year of 14th birthday: 5% of 5% of any compensation", "d) Calendar year of 15th birthday: 5% of 5% of any compensation", "e) Calendar year of 16th birthday: 10% of 5% of any compensation", "f) Calendar year of 17th birthday: 10% of 5% of any compensation", "g) Calendar year of 18th birthday: 10% of 5% of any compensation", "h) Calendar year of 19th birthday: 10% of 5% of any compensation", "i) Calendar year of 20th birthday: 10% of 5% of any compensation", "j) Calendar year of 21st birthday: 10% of 5% of any compensation", "k) Calendar year of 22nd birthday: 10% of 5% of any compensation", "l) Calendar year of 23rd birthday: 10% of 5% of any compensation", "2. A training club is entitled to receive (a proportion of) the 5% solidarity contribution in the following cases:", "a) a professional player is transferred, either on a definitive or loan basis, between clubs affiliated to different associations;", "b) a professional player is transferred, either on a definitive or loan basis, between clubs affiliated to the same association, provided that the training club is affiliated to a different association."]}, "RSTP:def": {"h": "Definitions, item 7", "p": ["7. Protected period: a period of three entire seasons or three years, whichever comes first, following the entry into force of a contract, where such contract is concluded prior to the 28th birthday of the professional, or two entire seasons or two years, whichever comes first, following the entry into force of a contract, where such contract is concluded after the 28 th birthday of the professional."]}, "DC:6": {"h": "Article 6: Disciplinary measures", "p": ["1. The following disciplinary measures may be imposed on natural and legal persons:", "a) warning;", "b) reprimand;", "c) fine or any other pecuniary measure;", "d) return of awards;", "e) withdrawal of a title;", "f) order to fulfil a financial obligation arising or existing in the context of a trial.", "2. The following disciplinary measures may be imposed on natural persons only:", "a) suspension for a specific number of matches or for a specific period;", "b) ban from dressing rooms and/or team bench;", "c) ban on taking part in any football-related activity;", "d) community football service;", "e) suspension or withdrawal of a football agent licence;", "f) suspension or withdrawal of a match agent licence.", "3. The following disciplinary measures may be imposed on legal persons only:", "a) ban on registering new players;", "b) playing a match without spectators;", "c) playing a match with a limited number of spectators;", "d) playing a match on neutral territory;", "e) ban on playing in a particular stadium;", "f) annulment of the result of a match;", "g) deduction of points;", "h) relegation to a lower division;", "i) expulsion from a competition in progress or from future competitions;", "j) forfeit;", "k) replaying a match;", "l) implementation of a prevention plan;", "m) forfeiture of training rewards that are due;", "n) payment of restitution to an affiliated club;", "o) payment of a specific amount to a club or a member association.", "4. In general, fines shall not be less than CHF 100 or more than CHF 1,000,000. However, fines in relation to specific provisions of this Code may extend beyond that range.", "5. Member associations are jointly liable for fines imposed on representative team players and officials. The same applies to clubs in respect of their players and officials.", "6. The disciplinary measures provided for in this Code may be combined."]}, "DC:10": {"h": "Article 10: Limitation period for prosecution", "p": ["1. Infringements may no longer be prosecuted in accordance with the following periods:", "a) two years for infringements committed during a match;", "b) ten years for anti-doping rule violations (as defined in the FIFA Anti‑Doping Regulations), infringements relating to international transfers involving minors, and match manipulation;", "c) five years for all other offences.", "2. The limitation period runs as follows:", "a) from the day on which the perpetrator committed the infringement;", "b) if the infringement is recurrent, from the day on which the most recent infringement was committed;", "c) if the infringement lasted for a certain period, from the day on which it ended;", "d) from the day on which the decision of the Football Tribunal or the Court of Arbitration for Sport (CAS) becomes final and binding.", "3. The limitation periods set out above are interrupted by all procedural acts, starting afresh with each interruption."]}, "DC:21": {"h": "Article 21: Failure to respect decisions", "p": ["1. Anyone who fails to pay another person (such as a player, a coach or a club) or FIFA a sum of money in full or part, even though instructed to do so by a body, a committee, a subsidiary or an instance of FIFA or a CAS decision (financial decision), or anyone who fails to comply with another final decision (non-financial decision) passed by a body, a committee, a subsidiary or an instance of FIFA, or by CAS:", "a) may be fined for failing to comply with a decision and receive any pertinent additional disciplinary measure; and, if necessary:", "b) will be granted a final deadline in which to pay the amount due or to comply with the non-financial decision;", "c) may be ordered to pay an interest rate of 18% p.a. to the creditor as from the date of the decision of the Disciplinary Committee rendered in connection to a CAS decision on an appeal against a (financial) decision passed by a body, a committee, a subsidiary or an instance of FIFA;", "d) in the case of clubs, upon expiry of the aforementioned final deadline and in the event of persistent default or failure to comply in full with the decision within the period stipulated, a ban on registering new players will be issued until the complete amount due is paid or the non-financial decision is complied with. A deduction of points or relegation to a lower division may also be ordered in addition to a ban on registering new players in the event of persistent failure (i.e. the ban on registering new players has been served for more than three entire and consecutive registration periods following the notification of the decision), repeated offences or serious infringements or if no full registration ban could be imposed or served for any reason;", "e) in the case of member associations, upon expiry of the aforementioned final deadline and in the event of persistent default or failure to comply in full with the decision within the period stipulated, additional disciplinary measures may be imposed;", "f) in the case of natural persons, upon expiry of the aforementioned final deadline and in the event of persistent default or failure to comply in full with the decision within the period stipulated, a ban on any football‑related activity for a specific period may be imposed. Other disciplinary measures may also be imposed.", "2. With regard to financial decisions passed by a body, a committee, a subsidiary or an instance of FIFA, or CAS, disciplinary proceedings may only commence at the request of the creditor or any other affected party who is entitled to be notified of the final outcome of the said disciplinary proceedings, including the motivated decision if so requested.", "3. If the sanctioned person disregards the final time limit, FIFA and/or the relevant association (in cases involving clubs or natural persons) shall implement the sanctions imposed. Where a registration ban (in the case of a club), a ban on any football-related activity (in the case of a natural person) or a disciplinary measure (in the case of member associations) has been enforced against a debtor in accordance with this article in relation to a financial obligation resulting from a CAS or FIFA decision and where the debtor provides FIFA with reliable evidence of having complied with such decision, such ban or measure may be provisionally lifted. The creditor will be invited to confirm whether such payment has been made.", "a) Should the debtor have provided accurate information and fully settled its financial obligation, the ban or measure is considered permanently lifted.", "b) Should the debtor have provided inaccurate information and/or have failed to comply with its financial obligation in full, the Disciplinary Committee may decide to:", "i. reinstate the ban or measure; and", "ii. impose additional disciplinary measures.", "4. The sporting successor of a non-compliant party shall also be considered a non‑compliant party and thus subject to the obligations under this provision. Criteria to assess whether an entity is to be considered as the sporting successor of another entity are, among others, its headquarters, name, legal form, team colours, players, shareholders or stakeholders or ownership and the category of competition concerned.", "5. With regard to financial decisions passed by a body, a committee, a subsidiary or an instance of FIFA, or CAS, creditors are expected to remain vigilant and take prompt legal action to enforce any financial claims arising from such decisions, including by actively registering their claims in accordance with the relevant domestic insolvency or bankruptcy proceedings, unless said claims are registered ex officio in those proceedings.", "a) Debtors must notify creditors in a timely and reasonable manner about the initiation of domestic insolvency or bankruptcy proceedings, and no later than 15 days after becoming aware of the initiation of such proceedings. They must also outline the creditors’ rights in the proceedings and the methods available to the creditors for registering a claim.", "b) Creditors shall be considered negligent if they fail to register their claims without valid justification and despite having been informed by the debtor about the initiation of domestic insolvency or bankruptcy proceedings.", "c) Creditors shall not be considered negligent if they are unable to register their claims in the relevant domestic insolvency or bankruptcy proceedings if the financial decision passed by a body, a committee, a subsidiary or an instance of FIFA, or CAS, is issued when the domestic registration period for claims has expired and cannot be reopened.", "6. Any financial or non-financial decision that has been issued against a club by a competent decision-making body within the relevant association shall be enforced by the association of the deciding body that has issued the decision in accordance with the principles established in this article and in compliance with the applicable disciplinary regulations. An association will be fined for failing to enforce the decision in accordance with this article. In the event of persistent failure to enforce the decision, additional disciplinary measures may be imposed on the association.", "7. Any financial or non-financial decision that has been issued against a natural person by a competent decision-making body within the relevant association shall be enforced by the association of the deciding body that has issued the decision or by the natural person’s new association, if the natural person has, in the meantime, been registered or licensed at another association, or otherwise employed by a club affiliated to another association or by another association, in accordance with the principles established in this article and in compliance with the applicable disciplinary regulations. An association will be fined for failing to enforce the decision in accordance with this article. In the event of persistent failure to enforce the decision, additional disciplinary measures may be imposed on the association.", "8. Any financial decision issued by the Football Tribunal or FIFA imposing disciplinary measures, such as a ban from registering any new players – either nationally or internationally – or a restriction on playing in official matches, will be automatically enforced by FIFA and the relevant member association. FIFA will be competent to deal with any issue relating to the enforcement of such decisions, including but not limited to the potential recognition of the sporting successor and the assessment of potential insolvency or bankruptcy proceedings.", "9. Where a decision issued by the FIFA Football Tribunal or a proposal confirmed by the FIFA general secretariat contains consequences for failure to pay relevant amounts on time and the debtor has not provided proof of payment after such consequences have been served in full, the Disciplinary Committee may decide to provisionally extend such consequences until a final decision has been rendered by this judicial body in accordance with this article.", "10. The Disciplinary Committee shall be competent to decide on cases related to the failure to respect settlement agreements concluded in the context of disciplinary proceedings opened against a debtor with respect to a final and binding financial decision issued by a body, a committee, a subsidiary or an instance of FIFA or by CAS. This shall include private agreements concluded after any decision passed by a body, a committee, a subsidiary or an instance of FIFA or by CAS and made in order to settle their dispute.", "11. Disciplinary proceedings for failing to respect a final CAS decision rendered in the context of ordinary proceedings may be initiated provided that the respective CAS procedure started after 15 July 2019."]}, "DC:54": {"h": "Article 54: Decisions", "p": ["1. Decisions are passed by a single judge or by a simple majority of the members present. If votes are equal, the chairperson has the casting vote.", "2. The FIFA judicial bodies may take decisions via personal meetings, telephone conference, video conference or any other similar method.", "3. In principle, the FIFA judicial bodies issue the terms of decisions without grounds, and only these terms of the decision are notified to the parties, who are informed that they have ten days from that notification to request, in writing via the FIFA Legal Portal, a motivated decision. Failure to make such a request results in the decision becoming final and binding and the parties being deemed to have waived their right to lodge an appeal.", "4. A motivated decision shall include at least:", "a) a brief summary of the facts, which does not need to include every single contention;", "b) the article(s) infringed;", "c) the considerations that are relevant to the potential breach of the FIFA regulations; and", "d) the criteria used to determine the possible sanction.", "5. If the motivated decision is requested within the time limit stipulated in paragraph 3 above, the time limit for lodging an appeal begins only on notification of the motivation. Only the parties to which a decision is addressed can request the motivation.", "6. Any appeal lodged before notification of the motivated decision is regarded exclusively as a request for motivation.", "7. Doping-related decisions are issued with grounds. In case of urgency, or under any other special circumstances, the relevant judicial body may notify the party of only the terms of the decision, which become immediately applicable. The full, written decision shall then be notified within 60 days.", "8. The FIFA secretariat publishes decisions issued by the FIFA judicial bodies. Where such a decision contains confidential information, FIFA may decide, ex officio or at the request of a party, to publish an anonymised or a redacted version.", "9. The request for a motivated decision does not affect the enforcement of the decision, which shall take effect as soon as it is notified, with the exception of orders to pay a sum of money.", "10. The competent judicial body may rectify any mistakes in calculation or any other obvious errors in the decision at any time."]}, "ETH:13": {"h": "Article 13: Limitation period for prosecution", "p": ["1. As a general rule, breaches of the provisions of this Code may no longer be prosecuted after five years have elapsed.", "2. Offences relating to bribery and corruption (article 28), as well as to misappropriation and misuse of funds (article 29) may no longer be prosecuted after ten years have elapsed.", "3. Offences relating to threats, the promise of advantages, coercion and all forms of sexual abuse, harassment and exploitation (article 24) are not subject to such limitation period.", "4. The limitation period, when applicable, shall be extended by half its length if a formal investigation is opened before its expiration.", "5. The limitation period, when applicable, shall be interrupted where criminal proceedings are formally opened against a person bound by this Code during such proceedings.", "6. In case of repeated breaches, the limitation period as described above shall start only after the last of the repeated breaches has ended."]}, "STAT:44": {"h": "Article 44: Judicial bodies", "p": ["1. The judicial bodies of FIFA are:", "(a) the Disciplinary Committee;", "(b) the Ethics Committee; and", "(c) the Appeal Committee.", "2. The Disciplinary Committee and the Appeal Committee shall consist of a chairperson, a deputy chairperson and a specific number of other members. Both chambers of the Ethics Committee shall each consist of a chairperson, two deputy chairpersons and a specific number of other members. The composition of the judicial bodies should respect the fair distribution of positions and take account of the member associations. When proposing chairpersons, deputy chairpersons and other members of judicial bodies to the Congress, the Council shall take into account appropriate female representation on the judicial bodies.", "3. The judicial bodies are to be composed in such a way that the members, together, have the knowledge, abilities and specialist experience that is necessary for the due completion of their tasks. The chairpersons and deputy chairpersons of the judicial bodies shall be qualified to practise law.", "4. The chairperson and deputy chairperson of the Disciplinary Committee and the chairpersons, deputy chairpersons and members of both chambers of the Ethics Committee and of the Appeal Committee shall fulfil the independence criteria as defined in the FIFA Governance Regulations and must pass an eligibility check carried out by the Review Committee.", "5. The chairpersons, deputy chairpersons and other members of the judicial bodies shall be elected by the Congress and shall not be members of any other FIFA body. Their terms shall last four years, beginning at the end of the Congress which has elected them. The chairpersons, deputy chairpersons and other members of the judicial bodies may only be relieved of their duties by the Congress.", "6. The chairpersons, deputy chairpersons and members of the judicial bodies may each serve a maximum of three terms (whether consecutive or not).", "7. If a chairperson, a deputy chairperson or a member of a judicial body resigns or   return `<span class="ref">${parseRef(r).map((x,i)=>x.key?`<button class="reflink" data-k="${x.key}" data-h='${esc(JSON.stringify(x.hl||{}))}'>${esc(x.label)} ↗</button>`:esc(x.label)).join('; ')}</span>`;
}
function openArt(key,hl){
  const a=ART[key]; if(!a)return; const doc=key.split(':')[0];
  let target=-1;
  if(hl&&hl.term) target=a.p.findIndex(p=>p.startsWith(hl.term+':'));
  else if(hl&&hl.n){const re=new RegExp('^'+hl.n+'\\.\\s'); target=a.p.findIndex(p=>re.test(p)&&(!hl.annex||p.length<70));}
  const ov=document.createElement('div'); ov.className='sheet-wrap';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(a.h)}">
    <div class="sheet-head"><div><div class="sheet-doc">${esc(DOCN[doc]||'')}</div><div class="sheet-title">${esc(a.h)}</div></div><button class="ghost" id="closeArt">Закрити</button></div>
    <div class="sheet-body">${a.p.map((p,i)=>`<p class="${/^([a-z]\)|\(?[ivx]+[\.\)]|\([a-z]\)|•)/.test(p)?'sub':''}${i===target?' hit':''}">${esc(p)}</p>`).join('')}
    <p class="sheet-note">Офіційний текст англійською з документа, який ти завантажив.</p></div></div>`;
  document.body.appendChild(ov); document.body.style.overflow='hidden';
  const close=()=>{ov.remove();document.body.style.overflow=''};
  ov.querySelector('#closeArt').onclick=close; ov.onclick=e=>{if(e.target===ov)close()};
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
  const h=ov.querySelector('.hit'); if(h) setTimeout(()=>h.scrollIntoView({block:'center'}),30);
  ov.querySelector('#closeArt').focus();
}
document.addEventListener('click',e=>{const b=e.target.closest('.reflink');if(b){e.preventDefault();openArt(b.dataset.k,JSON.parse(b.dataset.h||'{}'))}});
home();
