d:"Контракт укладено 1.07.2025, коли Руїсу було 27 (28 — лише 15.09.2025) → захищений період 3 сезони/3 роки, тобто до ~30.06.2028. A, B (ст. 17 п. 3), D (п. 1) правильні. C — класична пастка: вік на момент порушення значення не має."},
{t:"RSTP",c:"prot",r:"RSTP, Definitions п. 7; ст. 17 п. 3",
q:"A 30-year-old player signs a contract that enters into force on 1 January 2025. In February 2027 he terminates it without just cause. Which of the following statements are correct?",
o:["The breach occurs outside the protected period","No sporting sanctions will be imposed for the breach","He must pay compensation to the club","He faces a four-month restriction on playing in official matches"],a:[0,1,2],
e:"Після 28 — 2 сезони або 2 роки (що раніше) → до 1.01.2027 щонайпізніше. Лютий 2027 — поза періодом: компенсація так, санкцій ні.",
tq:"30-річний гравець підписує контракт, що набирає чинності 1 січня 2025. У лютому 2027 він розриває його без поважної причини. Які твердження правильні?",
to:["Порушення сталося поза захищеним періодом","Спортивних санкцій за порушення не буде","Він має сплатити клубу компенсацію","Йому загрожує чотиримісячна заборона грати в офіційних матчах"],
d:"Два роки від 1.01.2025 спливають 1.01.2027, а «whichever comes first» може зробити період лише коротшим. A, B (ст. 17 п. 3: після захищеного періоду спортивних санкцій немає), C — компенсація при будь-якому порушенні. D — неправильно. Але можливі дисциплінарні заходи, якщо він не повідомив про розірвання протягом 15 днів після останнього офіційного матчу сезону."},
{t:"RSTP",c:"jc",r:"RSTP ст. 14bis п. 1",
q:"A player's club has not paid his January and February salaries. On 5 March he sends a written default notice granting the club 10 days to pay; on 16 March, still unpaid, he terminates the contract relying on article 14bis. Which of the following statements are correct?",
o:["The termination does not meet the requirements of article 14bis, as the deadline granted was shorter than 15 days","The termination is valid under article 14bis because two monthly salaries were unpaid","Had he granted at least 15 days and the club still not paid, he would have had just cause under article 14bis","He needed FIFA's prior approval to terminate"],a:[0,2],
e:"Ст. 14bis: дві зарплати + письмова вимога + щонайменше 15 днів. 10 днів — замало.",
tq:"Клуб не виплатив гравцю зарплати за січень і лютий. 5 березня він надсилає письмову вимогу з 10 днями на оплату; 16 березня, не отримавши грошей, розриває контракт за ст. 14bis. Які твердження правильні?",
to:["Розірвання не відповідає вимогам ст. 14bis, бо наданий строк коротший за 15 днів","Розірвання дійсне за ст. 14bis, бо дві зарплати не виплачено","Якби він дав щонайменше 15 днів і клуб не заплатив, він мав би поважну причину за ст. 14bis","Йому було потрібне попереднє схвалення FIFA"],
d:"A і C — умови кумулятивні, і 15 днів обов'язкові (10 днів — строк зі ст. 12bis, звідси пастка). B — двох зарплат замало без належної вимоги. D — схвалення FIFA не потрібне. Примітка: такий випадок все ще можуть оцінити за загальною ст. 14, але гарантії ст. 14bis гравець не отримує."},
{t:"RSTP",c:"jc",r:"RSTP ст. 15",
q:"An established professional appeared in 3 of his club's 40 official matches this season (plus 10 friendlies). The club's last official match of the season was on 20 May. Which of the following statements are correct?",
o:["He may terminate for sporting just cause no later than 4 June","Compensation may still be payable","Sporting sanctions will be imposed on him","His friendly appearances count towards the 10% threshold"],a:[0,1],
e:"3/40 = 7,5% < 10%. Розірвати — протягом 15 днів після останнього офіційного матчу. Санкцій немає, компенсація можлива. Рахуються лише офіційні матчі.",
tq:"Досвідчений професіонал зіграв у 3 з 40 офіційних матчів клубу за сезон (і в 10 товариських). Останній офіційний матч сезону — 20 травня. Які твердження правильні?",
to:["Він може розірвати контракт зі спортивної поважної причини не пізніше 4 червня","Компенсація все одно може бути належною","До нього застосують спортивні санкції","Товариські матчі рахуються для порогу 10%"],
d:"A — 20 травня + 15 днів = 4 червня. B — ст. 15: «sporting sanctions shall not be imposed, though compensation may be payable» (тож C неправильне). D — ст. 15 говорить про «official matches». Також пам'ятай: підставу оцінюють індивідуально, з урахуванням обставин гравця (травми тощо)."},
{t:"RSTP",c:"loan",r:"RSTP ст. 10 пп. 6–8",
q:"Club A currently has six professionals out on loan, two of whom are club-trained players under 21 (loans concluded before the end of the season in which they turn 21). Three of the six are at Club B. Club A wants to loan out a 24-year-old professional. Which of the following statements are correct?",
o:["Club A cannot loan him to Club B","The two club-trained under-21 players do not count towards the overall limit of six","The restriction of three per specific club does not apply to club-trained under-21 players","Club A may loan him to Club C"],a:[0,1,3],
e:"Ліміт 3 на один клуб діє завжди. Загальний ліміт 6 не враховує вихованців до 21 → зараховано 4, ще є місце.",
tq:"Клуб A зараз має шість професіоналів в оренді, з них двоє — вихованці клубу до 21 (оренди до кінця сезону 21-річчя). Троє з шести — у клубі B. Клуб A хоче віддати в оренду 24-річного гравця. Які твердження правильні?",
to:["Клуб A не може віддати його в оренду клубу B","Двоє вихованців до 21 не враховуються в загальний ліміт шести","Обмеження «три на один клуб» не стосується вихованців до 21","Клуб A може віддати його в оренду клубу C"],
d:"A — у клубі B вже троє, а п. 8 діє «irrespective of age or club-trained status» (тому C неправильне). B — п. 7. D — у загальний ліміт зараховано 6 − 2 = 4, тож п'ятий можливий, якщо в клубі C менше трьох гравців з клубу A."},
{t:"RSTP",c:"minT",r:"RSTP ст. 19 пп. 2, 4",
q:"A 16-year-old Argentine player who also holds an Italian passport wants to move alone from an Argentine club to a Spanish club. Which of the following statements are correct?",
o:["The EU/EEA exception does not apply, as the transfer does not take place within the EU/EEA","The Italian passport makes the EU/EEA exception applicable","Any applicable exception requires approval by the Players' Status Chamber, as the player is over ten","The transfer could be permitted if his parents move to Spain for reasons not linked to football"],a:[0,2,3],
e:"Виняток b) i — «transfer takes place within the territory of the EU/EEA». З Аргентини — ні. Від 10 років — схвалення PSC.",
tq:"16-річний аргентинський гравець з італійським паспортом хоче сам переїхати з аргентинського клубу до іспанського. Які твердження правильні?",
to:["Виняток ЄС/ЄЄЗ не застосовується, бо трансфер не в межах ЄС/ЄЄЗ","Італійський паспорт робить виняток ЄС/ЄЄЗ застосовним","Будь-який виняток потребує схвалення Палати зі статусу гравців, бо гравцю понад десять","Трансфер можливий, якщо батьки переїдуть до Іспанії з причин, не пов'язаних з футболом"],
d:"A — умова b) i прив'язана до території трансферу, а не до громадянства, тому B — пастка. C — п. 4 a). D — виняток a). Нагадування: від 10 років схвалення PSC потрібне ще до запиту ITC (п. 5)."},
{t:"RSTP",c:"trn",r:"RSTP Annexe 4 ст. 2, 3, 5",
q:"Player Sam, born in 2004, was registered with Club A (Country X) from 2016 to 2021 and with Club B (Country X) as an amateur in 2022–2023. In 2024 he signs his first professional contract with Club C (Country Y, category 2). Which of the following statements are correct?",
o:["Club C owes training compensation to both Club A and Club B","The years 2016–2019 (his 12th–15th birthdays) are calculated on the basis of category 4 training costs","Only Club B, as his last club, is entitled to training compensation","No training compensation is due because Sam was over 18 when he turned professional"],a:[0,1],
e:"Перша профреєстрація → компенсація кожному клубу, що навчав з 12 років, пропорційно. Роки 12–15 — за 4-ю категорією.",
tq:"Гравець Сем 2004 року народження був зареєстрований у клубі A (країна X) у 2016–2021 і в клубі B (країна X) як аматор у 2022–2023. У 2024 він підписує перший професійний контракт з клубом C (країна Y, 2-га категорія). Які твердження правильні?",
to:["Клуб C винен компенсацію за навчання і клубу A, і клубу B","Роки 2016–2019 (12–15-річчя) рахують за витратами 4-ї категорії","Лише клуб B як останній має право на компенсацію","Компенсація не належить, бо Сему було понад 18, коли він став професіоналом"],
d:"A — Annexe 4 ст. 3 п. 1: при першій реєстрації професіоналом — кожному клубу, що сприяв навчанню з 12 років. «Лише останньому» (C) — правило для наступних трансферів. B — ст. 5 п. 3. D — компенсація належить до кінця року 23-річчя (ст. 2 п. 1 b); навчання — 12–21 рік)."},
{t:"RSTP",c:"sol",r:"RSTP Annexe 5 ст. 1 п. 1",
q:"Player Ali, born in 2001, is transferred during his contract in 2025 for EUR 20 million. Club X had him registered during the calendar years of his 20th to 23rd birthdays (2021–2024). What solidarity contribution is Club X entitled to?",
o:["EUR 400,000","EUR 1,000,000","EUR 500,000","Nothing, because the player was over 23 at the time of the transfer"],a:[0],
e:"5% від 20 млн = 1 млн; роки 20–23 = 4 × 10% = 40% → 400 000.",
tq:"Гравця Алі 2001 року народження у 2025 році під час контракту продають за 20 млн євро. Клуб X мав його зареєстрованим у календарні роки 20–23-річчя (2021–2024). Яку солідарну виплату має отримати клуб X?",
to:["400 000 євро","1 000 000 євро","500 000 євро","Нічого, бо гравцю на момент трансферу було понад 23"],
d:"Солідарність прив'язана до років навчання (12–23), а не до віку на момент трансферу, тому D — пастка. 1 млн — увесь 5% фонд (B). 500 000 — якщо порахувати 5 років. Правильно: 4 роки × 10% × 1 млн = 400 000."},
{t:"RSTP",c:"sol",r:"RSTP Annexe 5 ст. 1 пп. 1–2",
q:"A professional is transferred during his contract between two Spanish clubs for a fee. He was trained by a Spanish club and, earlier, by an Argentine club. Which of the following statements are correct?",
o:["The Argentine training club is entitled to its proportion of the solidarity contribution","The Spanish training club is entitled to its proportion of the solidarity contribution","No solidarity contribution applies to national transfers","The 5% is deducted from the transfer compensation"],a:[0,3],
e:"Національний трансфер: солідарність отримує лише клуб-вихователь іншої асоціації.",
tq:"Професіонала під час контракту продають між двома іспанськими клубами. Його навчали іспанський клуб і раніше аргентинський. Які твердження правильні?",
to:["Аргентинський клуб-вихователь має право на свою частку солідарного внеску","Іспанський клуб-вихователь має право на свою частку","Солідарність не застосовується до національних трансферів","5% утримують із трансферної компенсації"],
d:"A — Annexe 5 ст. 1 п. 2 b): при національному трансфері право є, якщо клуб-вихователь належить до іншої асоціації. B — іспанський клуб тієї ж асоціації не отримує (діють національні правила). C — надто загальне, тож неправильне. D — п. 1: 5% вираховують і розподіляє новий клуб."},
{t:"RSTP",c:"brg",r:"RSTP ст. 5bis; FFAR ст. 16 п. 3 f)",
q:"A player moves from Club A (Country 1) to Club B (Country 2) on 1 August, and from Club B to Club C (Country 3) on 1 October of the same year. Which of the following statements are correct?",
o:["It is presumed that the parties participated in a bridge transfer","The parties may rebut this presumption","A football agent involved in the scheme may be sanctioned","The presumption applies only if the clubs are in different confederations"],a:[0,1,2],
e:"Два послідовні трансфери протягом 16 тижнів (тут ~9) → презумпція, яку можна спростувати. Агентам участь заборонена.",
tq:"Гравець переходить з клубу A (країна 1) до клубу B (країна 2) 1 серпня, а з клубу B до клубу C (країна 3) — 1 жовтня того ж року. Які твердження правильні?",
to:["Презумується, що сторони брали участь у трансфері-містку","Сторони можуть спростувати цю презумпцію","Агента, причетного до схеми, можуть покарати","Презумпція діє лише якщо клуби в різних конфедераціях"],
d:"A — 1.08 → 1.10 це близько 9 тижнів < 16. B — «unless established to the contrary». C — FFAR ст. 16 п. 3 f) і RSTP ст. 5bis п. 3. D — вигадана умова: презумпція діє навіть для національних трансферів."},
// Statutes / DC / Ethics
{t:"Статут, етика, дисципліна",c:"dc",r:"Дисциплінарний кодекс ст. 54 пп. 3, 5, 9",
q:"On 1 March, a football agent is notified of the terms of a FIFA Disciplinary Committee decision (without grounds) imposing a fine. He does not request a motivated decision and, on 20 March, files an appeal with CAS. Which of the following statements are correct?",
o:["The decision became final and binding, and he is deemed to have waived his right to appeal","He should have requested a motivated decision within ten days of notification","His CAS appeal is admissible because it was filed within 21 days of 1 March","A request for a motivated decision does not affect enforcement of the decision, except for orders to pay a sum of money"],a:[0,1,3],
e:"10 днів на запит мотивування; без нього рішення остаточне і апеляція неможлива. Запит не зупиняє виконання, крім грошових стягнень.",
tq:"1 березня агенту повідомили резолютивну частину рішення Дисциплінарного комітету FIFA (без мотивування) про штраф. Він не запросив мотивоване рішення і 20 березня подав апеляцію до CAS. Які твердження правильні?",
to:["Рішення стало остаточним, і вважається, що він відмовився від права на апеляцію","Йому треба було запросити мотивоване рішення протягом десяти днів від повідомлення","Його апеляція до CAS прийнятна, бо подана протягом 21 дня від 1 березня","Запит мотивованого рішення не впливає на виконання рішення, крім стягнення грошових сум"],
d:"A і B — ст. 54 п. 3. D — п. 9. C — пастка: 21 день (Статут ст. 50) рахують від отримання мотивованого рішення (п. 5), а без запиту мотивування права на апеляцію вже немає."},
{t:"Статут, етика, дисципліна",c:"eth",r:"Кодекс етики ст. 13 пп. 2, 4",
q:"An official accepted a bribe in 2014. The Ethics Committee formally opened an investigation in 2023. Which of the following statements are correct?",
o:["The official can still be prosecuted in 2026","The limitation period expired in 2024","Opening the investigation extended the limitation period by half its length","Bribery is not subject to any limitation period"],a:[0,2],
e:"Хабарництво — 10 років (до 2024). Розслідування відкрили до спливу → строк збільшується наполовину (+5) → до 2029.",
tq:"Офіційна особа отримала хабар у 2014 році. Комітет з етики офіційно відкрив розслідування у 2023. Які твердження правильні?",
to:["Особу ще можна переслідувати у 2026 році","Строк давності сплив у 2024","Відкриття розслідування подовжило строк давності на половину його тривалості","Хабарництво не має строку давності"],
d:"10 років від 2014 → 2024; розслідування відкрито у 2023, тобто до спливу, тому п. 4 додає половину строку (5 років) → 2029. Отже A і C. B ігнорує подовження. D — без строку тільки порушення ст. 24."},
{t:"Статут, етика, дисципліна",c:"dc",r:"Дисциплінарний кодекс ст. 21 пп. 1–2",
q:"A club was ordered by the Football Tribunal to pay a player USD 100,000 and failed to pay by the final deadline granted by the Disciplinary Committee. Which of the following statements are correct?",
o:["A ban on registering new players will be issued until the amount is paid","A deduction of points may be ordered if the registration ban has been served for more than three entire and consecutive registration periods","Disciplinary proceedings for this financial decision start ex officio, without any request from the player","The club may also be fined for failing to comply with the decision"],a:[0,1,3],
e:"Заборона на реєстрацію до оплати; зняття очок — при стійкому невиконанні (понад 3 вікна). Провадження — лише на запит кредитора.",
tq:"Football Tribunal зобов'язав клуб сплатити гравцю 100 000 USD, але клуб не заплатив до останнього строку, наданого Дисциплінарним комітетом. Які твердження правильні?",
to:["Клубу заборонять реєструвати нових гравців до сплати суми","Можуть зняти очки, якщо заборона на реєстрацію діяла понад три повні послідовні реєстраційні періоди","Дисциплінарне провадження щодо цього фінансового рішення починається з ініціативи FIFA, без запиту гравця","Клуб також можуть оштрафувати за невиконання рішення"],
d:"A — ст. 21 п. 1 d). B — там само: «persistent failure (i.e. the ban ... served for more than three entire and consecutive registration periods)». D — п. 1 a). C — пастка: для фінансових рішень провадження починається лише на запит кредитора (п. 2)."},
{t:"Статут, етика, дисципліна",c:"trib",r:"Статут FIFA ст. 50 п. 3 b)",
q:"The FIFA Disciplinary Committee suspends a player for three matches for misconduct (not doping-related), and the Appeal Committee confirms the decision. Can the player appeal to CAS?",
o:["No, CAS does not deal with appeals against suspensions of up to four matches or three months","Yes, within 21 days of receipt of the decision","Yes, because all internal channels have been exhausted","Yes, but only if the suspension affects an international match"],a:[0],
e:"CAS не розглядає дискваліфікації до 4 матчів або 3 місяців (крім допінгу), навіть після вичерпання внутрішніх інстанцій.",
tq:"Дисциплінарний комітет FIFA дискваліфікував гравця на три матчі за порушення (не допінг), Апеляційний комітет підтвердив рішення. Чи може гравець оскаржити його в CAS?",
to:["Ні, CAS не розглядає апеляції на дискваліфікації до чотирьох матчів або трьох місяців","Так, протягом 21 дня від отримання рішення","Так, бо внутрішні інстанції вичерпано","Так, але лише якщо дискваліфікація стосується міжнародного матчу"],
d:"Ст. 50 п. 3 b) — виняток із юрисдикції CAS. B і C описують загальні умови апеляції (п. 1–2), які тут не допомагають, бо діє спеціальний виняток. D — вигадана умова. Рішення Апеляційного комітету в такому разі остаточне (ст. 47 п. 3)."},
{t:"FFAR",c:"ra",r:"FFAR ст. 12 п. 5",
q:"What is the maximum duration of a Representation Agreement between a Football Agent and a Releasing Entity?",
o:["Two years","Five years","The duration of the transfer agreement","None of the answers listed"],a:[3],
e:"Угоди з клубами (Engaging або Releasing Entity) не мають максимального строку.",
tq:"Який максимальний строк угоди про представництво між агентом і клубом-продавцем?",
to:["Два роки","П'ять років","Строк трансферного договору","Жодна з наведених відповідей"],
d:"Ст. 12 п. 5: угода з Engaging або Releasing Entity «is not subject to a maximum duration». 2 роки — максимум для гравців і тренерів. На іспиті варіант «None of the answers listed» трапляється, і він буває правильним — не відкидай його автоматично."}
];
H.forEach(m=>{Q.push({t:m.t,q:m.q,o:m.o,a:m.a,e:m.e,r:m.r,lv:1});T.push([m.tq,m.to]);D.push(m.d);CQ.push(m.c)});

const ART={"FFAR:def": {"h": "Definitions", "p": ["For the purpose of these regulations, the terms set out in the FIFA Statutes, the FIFA Regulations on the Status and Transfer of Players as well as the following definitions (initial capitals) shall apply:", "Agency: an organisation, entity, firm or private company retaining, comprising, employing or otherwise acting as a vehicle for the business affairs of one or more Football Agents.", "Approach: (i) any physical, in-person contact or contact via any means of electronic communication with a Client; (ii) any direct or indirect contact with another person or organisation linked to a Client, such as a family member or friend; or (iii) any action when a Football Agent uses or directs another person or organisation to contact a Client on their behalf in the manner described in (i) or (ii) above.", "Client: a member association, club, player, coach, or Single-Entity League that may engage a Football Agent to provide Football Agent Services.", "Connected Football Agent: a Football Agent is connected to another Football Agent as a result of their: (i) being employed or contractually retained by the same Agency through which Football Agent Services are conducted; (ii) both being directors, shareholders in, or co-owners of the same Agency through which Football Agent Services are conducted; (iii) being married to one another, domestic partners, siblings of one another, or parent and child or stepchild; or (iv) them having made any contractual or other arrangements, whether formal or informal, to cooperate, on more than one occasion, in the provision of any services or to share the revenue or profits of any part of their Football Agent Services.", "Engaging Entity: a club, member association or Single-Entity League that may engage a player or coach.", "Football Agent: a natural person licensed by FIFA to perform Football Agent Services.", "Football Agent Services: football-related services performed for or on behalf of a Client, including any negotiation, communication relating or preparatory to the same, or other related activity, with the purpose, objective and/or intention of concluding a Transaction.", "Individual: player or coach.", "Interest: (i) any beneficial ownership of a legal person through which the relevant activities of those entities are conducted, except an ordinary and freely accessible non-transferable personal membership entitling its owner to a single vote in club affairs; and/or (ii) being in a position that may enable the exercise of a material, financial, commercial, administrative, managerial or any other influence over the affairs of a natural or legal person whether directly or indirectly and whether formally or informally.", "Other Services: any services performed by a Football Agent for or on behalf of a Client other than Football Agent Services, including but not limited to, providing legal advice, financial planning, scouting, consultancy, management of image rights and negotiating commercial contracts.", "Platform: the digital platform operated by FIFA through which the licensing process, dispute resolution process, continuing professional development (CPD) and reporting shall occur.", "Regulations: these Football Agent Regulations, as amended from time to time.", "Releasing Entity: a club, member association or Single-Entity League that a player or coach is leaving to be employed and/or registered by an Engaging Entity.", "Remuneration: gross financial compensation for employment set out in a negotiated employment contract, which includes base salary, any sign-on fee, and any amount payable if certain conditions are fulfilled (for example, a loyalty or performance bonus). For the avoidance of doubt, any future transfer compensation agreed to and any non-salary benefits, such as the provision of a vehicle, accommodation or telephony services, are not considered in the calculation of the gross financial compensation.", "Representation Agreement: a written agreement for the purpose of establishing a legal relationship to provide Football Agent Services.", "RSTP: the FIFA Regulations on the Status and Transfer of Players, as amended from time to time.", "RWWI: the FIFA Regulations on Working with Intermediaries.", "Single-Entity League: an entity affiliated to a member association that organises a league (or leagues) and represents the common interests of its clubs, for example, by acting as the employer of all club players.", "Specified Transaction: a Transaction where all of the parties involved are defined and identified.", "Transaction: (i) the employment, registration or deregistration of a player with a club or a Single-Entity League; (ii) the employment of a coach with a club, SingleEntity League or a member association; (iii) the transfer of the registration of a player from one club to another; (iv) the creation, termination or variation of an Individual’s terms of employment. Terms referring to natural persons are applicable to both genders. Any term in the singular applies to the plural and vice versa."]}, "FFAR:2": {"h": "Article 2: Scope", "p": ["1. These Regulations govern the occupation of Football Agents within the international transfer system and apply:", "a) to all Representation Agreements with an international dimension; or", "b) any conduct connected to an international transfer or international Transaction.", "2. A Representation Agreement will have an international dimension whenever:", "a) it governs Football Agent Services related to a Specified Transaction in connection with an international transfer (or a move of a coach to a club affiliated to a different member association from that of their previous employer or to another member association than that of their previous employer); or", "b) it governs Football Agent Services related to more than one Specified Transaction, one of which is connected to an international transfer (or a move of a coach to a club affiliated to a different member association from that of their previous employer or to another member association than that of their previous employer).", "3. If the conduct is connected to a national transfer or national Transaction or a Representation Agreement governs Football Agent Services not related to Specified Transactions connected to an international transfer, the national football agent regulations of where the Client is registered or domiciled at the time the Representation Agreement is signed shall apply."]}, "FFAR:5": {"h": "Article 5: Eligibility requirements", "p": ["1. An applicant must:", "a) upon submitting their licence application (and subsequently thereafter, including after being granted a licence):", "i. have made no false or misleading or incomplete statements in their application;", "ii. never have been convicted of a criminal charge, including any related settlements, regarding matters related to: organised crime, drug trafficking, corruption, bribery, money laundering, tax evasion, fraud, match manipulation, misappropriation of funds, conversion, breach of fiduciary duty, forgery, legal malpractice, sexual abuse, violent crimes, harassment, exploitation or child or vulnerable young adult trafficking;", "iii. never have been the subject of a suspension of two years or more, disqualification or striking off by any regulatory authority or sports governing body for failure to comply with rules relating to ethics and professional conduct;", "iv. not be an official or employee of FIFA, a confederation, a member association, a league, a club, a body that represents the interests of clubs or leagues or any organisation connected directly or indirectly with such organisations and entities; the only exception is where an applicant has been appointed or elected to a body of FIFA, a confederation or a member association, representing the interests of Football Agents;", "v. not hold, either personally or through their Agency, any Interest in a club, academy, league or Single-Entity League.", "b) in the 24 months before the submission of a licence application, never have been found performing Football Agent Services without the required licence;", "c) in the five years before the submission of a licence application (and subsequently thereafter, including after being granted a licence):", "i. never have declared or been declared personally bankrupt or been a majority shareholder, director or key office holder of a business that has declared bankruptcy, entered administration and/or undergone liquidation;", "d) in the 12 months before the submission of a licence application (and subsequently thereafter, including after being granted a licence):", "i. not have held any Interest in any entity, company or organisation that brokers, arranges or conducts sports betting activities whereby a wager is placed on the outcome of a sporting event in order to win money.", "2. An applicant must satisfy the eligibility requirements:", "a) at the time of their application, in order to take the exam; and", "b) at all times after obtaining a licence, in accordance with article 17.", "3. The FIFA general secretariat is responsible for investigating compliance with the eligibility requirements."]}, "FFAR:7": {"h": "Article 7: Licence fee", "p": ["1. If an applicant passes the exam, they shall pay the annual licence fee to FIFA.", "2. The requirements related to the annual licence fee will be communicated annually by circular.", "3. The applicant must pay the annual fee within 90 days of passing the exam. Failure to do so will result in their application being automatically declared void."]}, "FFAR:8": {"h": "Article 8: Issue of licence", "p": ["1. A licence:", "a) is issued to a natural person for an indefinite period, subject to article 17;", "b) is strictly personal and non-transferable; and", "c) authorises a Football Agent to conduct Football Agent Services on a worldwide basis."]}, "FFAR:11": {"h": "Article 11: General provisions", "p": ["1. Only a Football Agent may perform Football Agent Services.", "2. A Football Agent must always satisfy the eligibility requirements in article 5 of these Regulations.", "3. A Football Agent may conduct their business affairs through an Agency. Any employees or contractors hired by the Agency that are not Football Agents may not perform Football Agent Services or make any Approach to a potential Client to enter into a Representation Agreement. A Football Agent remains fully responsible for any conduct by their Agency, its employees, contractors or other representatives should they violate these Regulations.", "4. The following natural or legal persons may not have an Interest in any affairs of a Football Agent or their Agency:", "a) Clients", "b) Any person who is ineligible to become a Football Agent under article 5 of these Regulations", "c) Any person or entity that owns or holds, whether directly or indirectly, any rights relating to the registration of a player, in violation of article 18bis or article 18ter of the RSTP"]}, "FFAR:12": {"h": "Article 12: Representation", "p": ["1. A Football Agent may only perform Football Agent Services for a Client after having entered into a written Representation Agreement with that Client.", "2. Only a Football Agent may Approach a potential Client or enter into a Representation Agreement with a Client for the provision of Football Agent Services.", "3. A Representation Agreement concluded between an Individual and a Football Agent may not exceed two years. This term may be extended by a new Representation Agreement only. Any automatic renewal provision, or any other provision that purports to extend any term of the Representation Agreement beyond the maximum period, shall be null and void.", "4. A Football Agent may only execute one Representation Agreement with the same Individual at any one time. Before entering into a Representation Agreement with an Individual, or before amending an existing Representation Agreement with an Individual, the Football Agent shall:", "a) inform the Individual in writing that they should consider taking independent legal advice in relation to the Representation Agreement; and", "b) obtain the Individual’s written confirmation that they have either obtained or decided not to take such independent legal advice.", "5. A Representation Agreement concluded between an Engaging Entity or Releasing Entity and a Football Agent is not subject to a maximum duration.", "6. A Football Agent may execute multiple Representation Agreements with the same Engaging Entity or Releasing Entity at any one time, subject to those agreements relating to different Transactions.", "7. A Representation Agreement is valid only if it contains the following minimum requirements:", "a) The names of the parties", "b) The duration (if applicable)", "c) The amount of the service fee due to the Football Agent", "d) The nature of the Football Agent Services to be provided", "e) The parties’ signatures", "8. A Football Agent may only perform Football Agent Services and Other Services for one party in a Transaction, subject to the sole exception in this article.", "a) Permitted dual representation: a Football Agent may perform Football Agent Services and Other Services for an Individual and an Engaging Entity in the same Transaction, provided that prior explicit written consent is given by both Clients.", "9. A Football Agent may, in particular, not perform Football Agent Services or Other Services in the same Transaction for:", "a) a Releasing Entity and Individual; or", "b) a Releasing Entity and Engaging Entity; or", "c) all parties within the same Transaction.", "10. A Football Agent and a Connected Football Agent may not perform Football Agent Services or Other Services for different Clients in the same Transaction, except in accordance with paragraph 8 of this article.", "11. Any relevant transfer or employment agreement in a Transaction that is concluded following the provision of Football Agent Services shall specify the Football Agent’s name, their Client, their FIFA licence number and their signature.", "12. A Client may negotiate and conclude a Transaction without engaging a Football Agent. If this is the case, this shall be explicitly stated in the relevant transfer or employment agreement.", "13. Any clause in a Representation Agreement that:", "a) limits an Individual’s ability to autonomously negotiate and conclude an employment contract without the involvement of a Football Agent; and/or", "b) penalises an Individual if they autonomously negotiate and/or conclude an employment contract without the involvement of a Football Agent, will be null and void.", "14. A Representation Agreement may be terminated at any time by either party if there is just cause to do so. A party revoking or terminating a Representation Agreement without just cause must compensate the other party for any resulting damage. There is just cause to terminate a Representation Agreement when a party can no longer reasonably be expected, according to the principle of good faith, to continue the contractual relationship for the agreed term. This includes, but is not limited to, the following situations:", "a) the withdrawal or suspension of a Football Agent licence;", "b) a ban on taking part in any football-related activity;", "c) a ban on registering new players, either nationally or internationally, for at least one entire registration period."]}, "FFAR:13": {"h": "Article 13: Representation of minors", "p": ["1. An Approach (and/or any subsequent execution of a Representation Agreement) to a minor or their legal guardian in relation to any Football Agent Services may only be made no more than six months before the minor reaches the age where they may sign their first professional contract in accordance with the law applicable in the country or territory where the minor will be employed. This Approach may only be made once prior written consent has been obtained from the minor’s legal guardian.", "2. A Football Agent that wishes to represent a minor or represent a club in a Transaction involving a minor shall first successfully complete the designated CPD course on minors and comply with any requirement to represent a minor established by the law applicable in the country or territory of the member association where the minor will be employed.", "3. A Representation Agreement between a Football Agent and a minor shall only be enforceable where:", "a) the Representation Agreement meets the minimum requirements provided in article 12 paragraph 7;", "b) the Football Agent has complied with paragraphs 1 and 2 of this article; and", "c) the Representation Agreement is signed by the minor and their legal guardian as provided by the law applicable in the country or territory of the member association where the minor will be employed.", "4. Any violation of paragraph 1 shall be sanctioned, at a minimum, with a fine and a suspension of a Football Agent licence of up to two years."]}, "FFAR:14": {"h": "Article 14: Service fee – general principles", "p": ["1. A Football Agent may charge a service fee to a Client as agreed in a Representation Agreement.", "2. Payment of the service fee due under a Representation Agreement shall be made exclusively by the Client of the Football Agent. A Client may not contract with or authorise any third party to make such payment.", "3. The only exception to the principle in paragraph 2 of this article is when a Football Agent is representing an Individual and their negotiated annual Remuneration is less than USD 200,000 (or equivalent), not counting any conditional payments. In such cases, an Engaging Entity may agree with an Individual to pay the service fee for that Transaction to their Football Agent in accordance with the Representation Agreement. All of the following conditions must apply:", "a) The service fee payment made by the Engaging Entity on behalf of the Individual shall not affect the fiduciary duty of the Football Agent to the Individual. It must also not create any dependency or subordination of the Football Agent towards the Engaging Entity.", "b) The service fee payment made by the Engaging Entity on behalf of the Individual must be no higher than the agreed service fee in the Representation Agreement between the Individual and Football Agent.", "c) The Engaging Entity may not deduct any service fee payment made pursuant to paragraph 3 of this article from the Individual’s Remuneration.", "4. The service fee due to a Football Agent shall be paid on an invoice basis.", "5. A Football Agent is entitled to receive a service fee only if the fee corresponds to the services stipulated in advance in a Representation Agreement, and the Representation Agreement is in force at the time at which the relevant Football Agent Services are performed.", "a) Where an employment contract has a duration longer than the associated Representation Agreement, a Football Agent may receive a service fee after expiry of the Representation Agreement as long as the Individual’s negotiated employment contract is still in effect, and provided that this is expressly agreed with the Client in the Representation Agreement.", "6. Payment of any service fee shall be made after the closure of the relevant registration period and in instalments every three months for the duration of the negotiated employment contract.", "7. Only the Remuneration actually received by an Individual shall be subject to the payment of a service fee, calculated on a pro-rata basis.", "8. Where a negotiated employment contract is less than six months in duration, payment shall be made in a single instalment at the expiry of the negotiated employment contract.", "9. A Football Agent may not receive a service fee when engaged to perform Football Agent Services relating to a minor unless the relevant player is signing their first or subsequent professional contract in accordance with the law applicable in the country or territory of the member association where the minor will be employed.", "10. Where a Football Agent acts on behalf of an Engaging Entity and an Individual in the same Transaction under article 12 paragraph 8 a) of these Regulations (permitted dual representation), the Engaging Entity may pay up to 50% of the total service fee due.", "11. A Releasing Entity shall pay a service fee to a Football Agent following receipt of each instalment of the transfer compensation due to the Releasing Entity. The Releasing Entity shall duly inform the Football Agent of any such instalments received.", "12. A Football Agent is not entitled to receive any service fee not yet due deriving from a negotiated employment contract where:", "a) the Individual transfers to another Engaging Entity before the negotiated employment contract expires; or", "b) the negotiated employment contract is prematurely terminated by the Individual without just cause and the Football Agent still represents the Individual at the time of that termination.", "13. All service fee payments to Football Agents shall be made through the FIFA Clearing House in accordance with the FIFA Clearing House Regulations.", "a) If the FIFA Clearing House Regulations do not regulate service fee payments to Football Agents when these Regulations enter into force, payment shall be made directly to the Football Agent until such time that the FIFA Clearing House Regulations regulate service fee payments."]}, "FFAR:15": {"h": "Article 15: Service fee cap", "p": ["1. The service fee payable to a Football Agent for the performance of Football Agent Services shall be calculated as follows:", "a) When representing an Individual or Engaging Entity: based on the Individual’s Remuneration", "b) When representing a Releasing Entity: based on the transfer compensation for the relevant Transaction", "2. The maximum service fee payable for the provision of Football Agent Services in a Transaction, regardless of the number of Football Agents providing Football Agent Services to a particular Client, is:", "• Individual: 5% of the Individual’s Remuneration (annual Remuneration ≤ USD 200,000) / 3% (above USD 200,000)", "• Engaging Entity: 5% of the Individual’s Remuneration (≤ USD 200,000) / 3% (above USD 200,000)", "• Engaging Entity and Individual (permitted dual representation): 10% (≤ USD 200,000) / 6% (above USD 200,000)", "• Releasing Entity: 10% of the transfer compensation", "For the avoidance of doubt, the following shall apply:", "a) The calculation to determine the relevant service fee cap of the Individual’s Remuneration may not take into account any conditional payments.", "b) If an Individual’s Remuneration is above USD 200,000 (or equivalent), the annual excess above that amount shall be subject to a service fee cap of 3% if the Football Agent is representing an Individual or an Engaging Entity or 6% if they are representing both an Engaging Entity and an Individual (permitted dual representation).", "c) The calculation of the transfer compensation may not include:", "i. any amount paid as compensation for breach of contract pursuant to article 17 or Annexe 2 of the RSTP; and/or", "ii. any sell-on fee.", "3. Where a Football Agent or a Connected Football Agent, in the 24 months prior to or following a Transaction, performs Other Services for a Client involved in that Transaction, it shall be presumed that the Other Services formed part of the Football Agent Services performed in that Transaction, unless proven to the contrary.", "4. Where a Football Agent and/or Client fails to rebut the presumption in paragraph 3 of this article, the fees paid for the Other Services shall be deemed to be part of the service fee paid for the Football Agent Services performed in that Transaction."]}, "FFAR:16": {"h": "Article 16: Rights and obligations", "p": ["1. A Football Agent may:", "a) provide Football Agent Services to any Client that executes a written Representation Agreement that contains the minimum terms described in article 12 of these Regulations;", "b) not Approach a Client that is bound by an exclusive Representation Agreement with another Football Agent, except in the final two months of that exclusive Representation Agreement;", "c) not enter into a Representation Agreement with a Client that is bound by an exclusive Representation Agreement with another Football Agent, except in the final two months of that exclusive Representation Agreement.", "2. A Football Agent shall:", "a) always act in the best interests of their Client(s);", "b) respect and adhere to the Statutes, regulations, directives and decisions of the competent bodies of FIFA, the confederations and member associations;", "c) avoid conflicts of interest while providing their Football Agent Services;", "d) ensure that their name, licence number, signature and the name of their Client appear in any contracts resulting from the provision of their Football Agent Services;", "e) always meet the eligibility requirements while licensed, as described in articles 5 and 17 of these Regulations;", "f) pay an annual licence fee to FIFA within the deadline stipulated on the Platform, as described in articles 7 and 17 of these Regulations;", "g) comply with the CPD requirements, as described in articles 9 and 17 of these Regulations;", "h) comply with the ongoing disclosure and reporting requirements, as described under j) below and in paragraph 4 of this article;", "i) immediately report any breaches of these Regulations, or FIFA, confederation or member association rules, regulations or codes of conduct to the relevant authority or body;", "j) upload to the Platform:", "i. within 14 days of execution, amendment or termination of a Representation Agreement: the relevant Representation Agreement and the information requested on the Platform;", "ii. within 14 days of execution: any agreement with a Client other than a Representation Agreement, including but not limited to agreements relating to Other Services and the information requested on the Platform;", "iii. within 14 days of payment of a service fee: the information requested on the Platform;", "iv. within 14 days of payment of a fee related to any agreement entered into with a Client other than a Representation Agreement: the information requested on the Platform;", "v. within 14 days of occurrence: any contractual or other arrangement between Football Agents to cooperate in the provision of any services or to share the revenue or profits of any part of their Football Agent Services;", "vi. within 14 days of occurrence: any information that may impact the obligation to meet the eligibility requirements; and", "vii. within 14 days of occurrence: any settlement agreement entered into with a Client or another Football Agent.", "k) if they conduct their business affairs through an Agency, upload to the Platform:", "i. within 14 days of the first Transaction involving the Agency: its ownership structure, the identity of the shareholders, the percentage owned in its share capital and/or identity of its beneficial owners;", "ii. within 14 days of the first Transaction involving the Agency: the number of Football Agents that use the same Agency to conduct their business affairs and the name of all its employees; and", "iii. within 30 days of occurrence: any changes to any of the information previously provided in relation to the Agency.", "3. A Football Agent may not engage, or attempt to engage, in the following conduct:", "a) Approach, enter into negotiations, take any steps, solicit or in any way facilitate discussions between parties with a view to a Transaction (including the making of statements to the media), regarding any Individual with the aim of inducing them to prematurely terminate their employment contract without just cause or violate any obligations in their employment contract.", "b) Offer or pay any undue personal, pecuniary or other advantage, either directly or indirectly, to:", "i. any official or employee of a member association, club or Single Entity League in connection with Football Agent Services; or", "ii. an Individual (or any family member or legal guardian or friend of that Individual) in relation to a Representation Agreement with that Football Agent.", "c) Conceal material facts from a Client, including without limitation:", "i. failing to declare a conflict of interest (even if such conflict would otherwise be permitted in accordance with these Regulations); or", "ii. failing to report a written offer (by any means of communication) made to a Client.", "d) Circumvent the cap established by these Regulations, either directly or indirectly, by, for example and without limitation, intentionally increasing the service fee charged or that otherwise would have been charged to the Client for Other Services.", "e) Accept payment of any transfer compensation or training reward that is payable in connection with a player’s transfer between clubs. This includes, without limitation, any rights as described in article 18ter of the RSTP.", "f) Be involved, directly or indirectly, in a bridge transfer as defined in the RSTP or own or hold any rights relating to the registration of a player, in violation of article 18bis or article 18ter of the RSTP.", "g) Violate these Regulations in any other way.", "4. With regard to disclosure and reporting, a Football Agent shall:", "a) immediately inform a Client of any written offer (by any means of communication) they have received in relation to their Client;", "b) provide to a Client, on request, a copy of the relevant Representation Agreement or any other written agreements in relation to Other Services, a copy of the employment contract or any other written documents obtained in relation to the Football Agent Services, a schedule detailing payments of any kind whatsoever made to the Football Agent in relation to a Transaction in which they were involved; and", "c) upon request, cooperate with the relevant body of each member association, confederation and/or FIFA with respect to any request for any type of information in any form."]}, "FFAR:17": {"h": "Article 17: Compliance with ongoing licensing requirements", "p": ["1. If a Football Agent fails to:", "a) meet the eligibility requirements at any time;", "b) pay the annual licence fee to FIFA within the deadline stipulated on the Platform;", "c) comply with the CPD requirements in a calendar year; or", "d) comply with their reporting obligations; their licence shall automatically be provisionally suspended.", "2. The FIFA general secretariat is responsible for investigating compliance with the requirements in paragraph 1 of this article.", "3. If paragraph 1 a) of this article applies:", "a) the FIFA general secretariat will notify the Football Agent that it believes there are grounds to consider that they do not meet the eligibility requirements, and of the automatic provisional suspension; and", "b) the matter will be referred to the FIFA Disciplinary Committee for its decision.", "4. If one or more of the circumstances described in paragraphs 1 b), c) or d) of this article apply:", "a) the FIFA general secretariat will notify the Football Agent of their non-compliance and of the automatic provisional suspension; and", "b) if the Football Agent fails to rectify their non-compliance within 60 days of their licence being automatically provisionally suspended, their licence shall be withdrawn."]}, "FFAR:18": {"h": "Article 18: Engagement of Football Agents", "p": ["1. Clients:", "a) may engage a Football Agent to perform Football Agent Services, provided that they do not choose to undertake such activities themselves;", "b) shall pay the service fee agreed with a Football Agent in a timely manner established by these Regulations and in accordance with the respective Representation Agreement, employment contract and transfer agreement (as applicable);", "c) shall satisfy themselves that a Football Agent is appropriately licensed by FIFA prior to signing the relevant Representation Agreement;", "d) shall cooperate with the relevant body of each member association, confederation and/or FIFA with respect to any request in relation to a Football Agent made by those bodies;", "e) may request from the Football Agent a schedule detailing all payments of any kind whatsoever (including all remuneration, fees and expenses) made by and/or regarding that Client;", "f) (for clubs) shall upload to the FIFA Transfer Matching System (TMS) within 14 days of occurrence:", "i. the information requested in TMS on completion of each Transaction that is an international transfer in which the club is involved;", "ii. any amendment to, or termination of, a relevant Representation Agreement;", "iii. any agreement with a Football Agent other than a Representation Agreement, including but not limited to Other Services, and the information requested in TMS;", "iv. the information requested in TMS following the payment of a fee related to any agreement entered into with a Football Agent other than a Representation Agreement; and", "g) shall immediately report any breaches of these Regulations to FIFA, the confederations or member associations.", "2. Clients (and their officials, when applicable) may not engage, or attempt to engage, in the following conduct:", "a) Engage or appoint an unlicensed person to perform Football Agent Services;", "b) Accept or request any undue personal, pecuniary or other advantage from a Football Agent;", "c) Give, offer or seek to offer consideration or a promise of any kind, either directly or indirectly, to a Football Agent (or to any family member of, or other person connected with, that Football Agent), other than the service fee agreed;", "d) For member associations, clubs and Single-Entity Leagues, interfere in, or influence, the freedom of an Individual to select a Football Agent;", "e) Participate, or assist, directly or indirectly, in any circumvention of the service fee cap established by these Regulations;", "f) Have an Interest in an Agency or the affairs of a Football Agent, in accordance with article 11 paragraph 4 of these Regulations;", "g) For member associations, clubs and Single-Entity Leagues, either directly or indirectly, induce or coerce an Individual to breach the terms of their Representation Agreement with their Football Agent;", "h) Fail to immediately report any breach of these Regulations to FIFA;", "i) Permit a Football Agent or their Agency to have an Interest in them; or", "j) Any other breach of these Regulations."]}, "FFAR:19": {"h": "Article 19: Disclosure and publication", "p": ["1. FIFA shall make available:", "a) the names and details of all Football Agents;", "b) the Clients that Football Agents represent, the exclusivity or non-exclusivity of their representation and the expiry date of the Representation Agreement;", "c) the Football Agent Services provided to each Client;", "d) any sanctions imposed on Football Agents and Clients; and", "e) details of all Transactions involving Football Agents, including the service fee amounts paid to Football Agents."]}, "FFAR:20": {"h": "Article 20: Jurisdiction", "p": ["1. Without prejudice to the right of a Football Agent or a Client to seek redress before an ordinary court of law, the Agents Chamber of the Football Tribunal has jurisdiction to determine disputes:", "a) arising out of, or in connection with, a Representation Agreement with an international dimension (see art. 2 par. 2 of these Regulations);", "b) where a claim is lodged in accordance with the Procedural Rules Governing the Football Tribunal; and", "c) where no more than two years have elapsed from the event giving rise to the dispute; the application of this time limit shall be examined ex officio in each case.", "2. The detailed procedures for the resolution of disputes are set out in the Procedural Rules Governing the Football Tribunal.", "3. Without prejudice to the right of a Football Agent or a Client to seek redress before an ordinary court of law, for disputes arising out of, or in connection with, a Representation Agreement without an international dimension, the decision-making body identified in the national football agent regulations of the relevant member association has jurisdiction to determine such disputes (cf. art. 2 par. 3)."]}, "FFAR:21": {"h": "Article 21: Competence and enforcement", "p": ["1. The FIFA Disciplinary Committee and, where relevant, the independent Ethics Committee are competent to impose sanctions on any Football Agent or Client that violates these Regulations, the FIFA Statutes or any other FIFA regulations, in accordance with these Regulations, the FIFA Disciplinary Code and the FIFA Code of Ethics. FIFA has jurisdiction regarding:", "a) any conduct connected to a Representation Agreement with an international dimension (cf. article 2 par. 2); or", "b) any conduct connected to an international transfer or international Transaction.", "2. The relevant member association is responsible for imposing sanctions on any Football Agent or Client that violates their national football agent regulations. The relevant member association has jurisdiction regarding:", "a) any conduct connected to a Representation Agreement without an international dimension (cf. article 2 par. 3); or", "b) any conduct connected to a national transfer or national Transaction.", "3. The FIFA general secretariat shall monitor compliance with these Regulations. In particular:", "a) Any party that receives a notice requesting information shall cooperate in full by complying, upon reasonable notice, with requests for any documents, information or any other material of any nature held by it, as well as with requests to procure and provide any documents, information or any other material of any nature not held by the party but which the party is entitled to obtain. Failure to comply with these requests from the FIFA general secretariat may lead to sanctions being imposed by the FIFA Disciplinary Committee. If requested by the FIFA general secretariat, a document (or an excerpt) shall be provided in English, French or Spanish.", "b) Electronic notifications through the Platform or TMS or sent by email to the address provided on the Platform or TMS by the parties are considered valid means of communication and will be deemed sufficient to establish time limits.", "c) Following an investigation, the FIFA general secretariat may refer cases of non-compliance with these Regulations to the FIFA Disciplinary Committee in accordance with the FIFA Disciplinary Code.", "d) Following an investigation, the FIFA general secretariat may refer cases of ethical misconduct in relation to these Regulations to the independent Ethics Committee in accordance with the FIFA Code of Ethics."]}, "RSTP:5bis": {"h": "Article 5bis: Bridge transfer", "p": ["1. No club or player shall be involved in a bridge transfer.", "2. It shall be presumed, unless established to the contrary, that if two consecutive transfers, national or international, of the same player occur within a period of 16 weeks, the parties (clubs and player) involved in those two transfers have participated in a bridge transfer.", "3. The FIFA Disciplinary Committee, in accordance with the FIFA Disciplinary Code, will impose sanctions on any party subject to the FIFA Statutes and regulations involved in a bridge transfer."]}, "RSTP:6": {"h": "Article 6: Registration periods", "p": ["1. Players may only be registered during one of the two annual registration periods fixed by the relevant association. Associations may fix different registration periods for their male and female competitions.", "2. The first registration period may begin as early as on the first day after the day on which the competition period of the previous season ended, and at the latest on the first day of the new season. This first registration period shall not be shorter than eight weeks or longer than 12 weeks. The second registration period shall occur in the middle of the season and shall not be shorter than four weeks or longer than eight weeks. The cumulative total of both registration periods may not exceed 16 weeks. The dates of the competition period and the two registration periods for the season shall be entered into TMS at least 12 months before they come into force (cf. Annexe 3). All transfers, whether a national transfer or an international transfer, shall only occur within these registration periods, subject to the exceptions in article 6 as per paragraph 3 hereinafter. FIFA shall determine the dates for any association that fails to communicate them on time.", "3. Member associations are authorised to exceptionally register players outside a registration period in the following circumstances:", "a) A professional who has unilaterally terminated their contract with just cause, or whose contract has been unilaterally terminated without just cause by their club, may be registered outside a registration period. Upon receipt of the ITC request, the FIFA general secretariat shall expeditiously assess on a prima facie basis whether the unilateral termination occurred with or without just cause and permit or deny the registration accordingly. Such prima facie assessment is without prejudice to a decision of the Football Tribunal about the consequences of the termination of contract.", "b) A professional whose contract has naturally expired or has been mutually terminated prior to the end of the registration period applicable to the engaging club may be registered with the engaging club also after expiry of the respective registration period.", "c) A female player may be registered outside a registration period to temporarily replace another female player that has exercised her rights linked to pregnancy, adoption or family leave. The period of the contract of the temporary replacement player shall, unless otherwise mutually agreed, be from the date of registration until the day prior to the start of the first registration period after the return of the female player that has taken the relevant leave.", "d) A female player may be registered outside a registration period upon completion of her family, adoption or maternity leave or recovery related to her pregnancy (cf. article 18 paragraph 7 and article 18quater) subject to her contractual status.", "e) A professional whose contract has expired or been terminated as a result of COVID-19 has the right to be registered outside a registration period, regardless of the date of expiry or termination.", "f) Competition Regulations for the FIFA Club World Cup™ may establish further exceptions.", "4. Whenever allowing a registration outside a registration period, member associations shall pay due consideration to the sporting integrity of the relevant competition. Collective bargaining agreements validly negotiated by employers’ and employees’ representatives at domestic level in accordance with national law may define the criterion of sporting integrity in more detail.", "5. In cases where the FIFA general secretariat allows a registration outside a registration period based on the exception in paragraph 3 a), any domestic regulatory provision or contractual agreement requiring the consent of the former club to register the player shall be null and void. In cases where a player’s employment contract has expired, consent of the former club shall never be required to register the player.", "6. With respect to the exceptions in paragraph 3 c) and d), associations shall adapt their domestic rules accordingly. However, priority shall be given to ensuring that a female player that has returned from maternity leave is eligible to participate in domestic competitions, as well as the sporting integrity of the relevant competition.", "7. Players may only be registered, subject to the exceptions provided for in article 6 paragraph 3, upon submission through the electronic player registration system of a valid application from the club to the relevant association during a registration period.", "8. The provisions concerning registration periods do not apply to competitions in which only amateurs participate. The relevant association shall specify the periods when players may be registered for such competitions provided that due consideration is given to the sporting integrity of the relevant competition."]}, "RSTP:10": {"h": "Article 10: Loan of professionals", "p": ["1. A professional may be loaned for a predetermined period by their club (“former club”) to another club (“new club”) on the basis of a written agreement. The following rules apply to the loan of professionals:", "a) The clubs shall conclude a written agreement defining the terms of the loan (“loan agreement”), in particular, its duration and financial conditions. The professional may also be a party to the loan agreement", "b) The professional and the new club shall sign a contract covering the duration of the loan. This contract shall acknowledge that the professional is on loan.", "c) During the agreed duration of the loan, the contractual obligations between the professional and the former club shall be suspended unless otherwise agreed in writing.", "d) Subject to article 5 paragraph 4, a loan agreement may be concluded for a minimum duration of the time between two registration periods and a maximum duration of one year. The end date shall fall within one of the registration periods of the association of the former club. Any clause referring to a longer duration of the loan shall not be recognised.", "e) A loan agreement may be extended, subject to the above minimum and maximum durations, with the written consent of the professional.", "f) A new club is prohibited from sub-loaning or permanently transferring a professional to a third club.", "2. Loan agreements with a duration of more than one year which predate the entering into force of these regulations may continue until their contractual expiration. They may be extended only in accordance with article 10 paragraph 1 e).", "3. The loan of a professional is subject to the administrative procedures provided in articles 5-9 and Annexe 3.", "4. Where the contract between a professional and the new club has been unilaterally terminated prior to the completion of the duration agreed in the loan agreement:", "a) the professional has the right to return to the former club;", "b) the professional must immediately inform the former club of the premature termination and whether they intend to return to the former club;", "c) if the professional decides to return to the former club, the former club must reintegrate the professional immediately. The contract which was suspended during the loan shall be reinstated from the date of reintegration, and in particular, the former club must remunerate the professional;", "d) rules governing registration at national level must be determined by the association in agreement with domestic football stakeholders.", "5. The terms of article 10 paragraph 4 are without prejudice to:", "a) the operation of article 17 relating to termination of the contract between the professional and the new club;", "b) the operation of article 17, should the former club fail to reintegrate the professional immediately; and", "c) the right of the former club to seek compensation resulting from its obligation to reintegrate the professional. The minimum compensation payable shall be the amount the former club must pay the professional between the date of reintegration and the original completion date of the loan agreement.", "6. The following limitations apply from 1 July 2024:", "a) a club may have a maximum of six professionals loaned out at any given time during a season;", "b) a club may have a maximum of six professionals loaned in at any given time during a season.", "7. The loan of a professional will be exempt from the above limitations if:", "a) the loan occurs before the end of the season of the former club in which the professional turns 21; and", "b) the professional is a club-trained player with the former club.", "8. The following restrictions apply irrespective of age or club-trained status:", "a) a club may have a maximum of three professionals loaned out to a specific club at any given time during a season;", "b) a club may have a maximum of three professionals loaned in from a specific club at any given time during a season.", "9. The following transition period shall apply for the limitations in article 10 paragraph 6:", "a) from 1 July 2022 to 30 June 2023: a maximum of eight professionals for each limitation;", "b) from 1 July 2023 to 30 June 2024: a maximum of seven professionals for each limitation."]}, "RSTP:12bis": {"h": "Article 12bis: Overdue payables", "p": ["1. Clubs are required to comply with their financial obligations towards players and other clubs as per the terms stipulated in the contracts signed with their professional players and in the transfer agreements.", "2. Any club found to have delayed a due payment for more than 30 days without a prima facie contractual basis may be sanctioned in accordance with paragraph 4 below.", "3. In order for a club to be considered to have overdue payables in the sense of the present article, the creditor (player or club) must have put the debtor club in default in writing and have granted a deadline of at least ten days for the debtor club to comply with its financial obligation(s).", "4. Within the scope of its jurisdiction (cf. article 22 to 24), the Football Tribunal may impose the following sanctions:", "a) a warning;", "b) a reprimand;", "c) a fine;", "d) a ban from registering any new players, either nationally or internationally, for one or two entire and consecutive registration periods.", "5. The sanctions provided for in paragraph 4 above may be applied cumulatively.", "6. A repeated offence will be considered an aggravating circumstance and lead to a more severe penalty.", "7. The terms of the present article are without prejudice to the application of further measures in accordance with article 17 in the event of unilateral termination of the contractual relationship."]}, "RSTP:14": {"h": "Article 14: Terminating a contract with just cause", "p": ["1. A contract may be terminated by either party without consequences of any kind (either payment of compensation or imposition of sporting sanctions) where there is just cause. In general, just cause shall exist in any circumstance in which a party can no longer reasonably and in good faith be expected to continue a contractual relationship.", "2. Any abusive conduct of a party aiming at forcing the counterparty to terminate or change the terms of the contract shall entitle the counterparty (a player or a club) to terminate the contract with just cause."]}, "RSTP:14bis": {"h": "Article 14bis: Terminating a contract with just cause for outstanding salaries", "p": ["1. In the case of a club unlawfully failing to pay a player at least two monthly salaries on their due dates, the player will be deemed to have a just cause to terminate his contract, provided that he has put the debtor club in default in writing and has granted a deadline of at least 15 days for the debtor club to fully comply with its financial obligation(s). Alternative provisions in contracts existing at the time of this provision coming into force may be considered.", "2. For any salaries of a player which are not due on a monthly basis, the pro-rata value corresponding to two months shall be considered. Delayed payment of an amount which is equal to at least two months shall also be deemed a just cause for the player to terminate his contract, subject to him complying with the notice of termination as per paragraph 1 above.", "3. Collective bargaining agreements validly negotiated by employers’ and employees’ representatives at domestic level in accordance with national law may deviate from the principles stipulated in paragraphs 1 and 2 above. The terms of such an agreement shall prevail."]}, "RSTP:15": {"h": "Article 15: Terminating a contract with sporting just cause", "p": ["An established professional who has, in the course of the season, appeared in fewer than ten per cent of the official matches in which his club has been involved may terminate his contract prematurely on the ground of sporting just cause. Due consideration shall be given to the player’s circumstances in the appraisal of such cases. The existence of sporting just cause shall be established on a case-by-case basis. In such a case, sporting sanctions shall not be imposed, though compensation may be payable. A professional may only terminate his contract on this basis in the 15 days following the last official match of the season of the club with which he is registered."]}, "RSTP:16": {"h": "Article 16: Restriction on terminating a contract during the competition period", "p": ["A contract cannot be unilaterally terminated during a competition period."]}, "RSTP:17": {"h": "Article 17: Consequences of terminating a contract without just cause", "p": ["The following provisions apply if a contract is terminated without just cause:", "1. In all cases, the party that has suffered as a result of a breach of contract by the counterparty shall be entitled to receive compensation. Subject to the provisions of article 20 and Annexe 4 in relation to training compensation, and unless otherwise provided for in the contract, compensation for the breach shall be calculated taking into account the damage suffered, according to the “positive interest” principle, having regard to the individual facts and circumstances of each case, and with due consideration for the law of the country concerned. Bearing in mind the aforementioned principles, compensation due to a player shall be calculated as follows:", "i. In case the player did not sign any new contract following the termination of his previous contract, as a general rule, the compensation shall be equal to the residual value of the contract that was prematurely terminated.", "ii. In case the player signed a new contract by the time of the decision, the value of the new contract for the period corresponding to the time remaining on the prematurely terminated contract shall be deducted from the residual value of the contract that was terminated early (the “Mitigated Compensation”). Furthermore, and subject to the early termination of the contract being due to overdue payables, in addition to the Mitigated Compensation, the player shall be entitled to an amount corresponding to three monthly salaries (the “Additional Compensation”). In case of egregious circumstances, the Additional Compensation may be increased up to a maximum of six monthly salaries. The overall compensation may never exceed the rest value of the prematurely terminated contract.", "iii. Collective bargaining agreements validly negotiated by employers’ and employees’ representatives at domestic level in accordance with national law may deviate from the principles stipulated in the points i. and ii. above. The terms of such an agreement shall prevail.", "2. Entitlement to compensation cannot be assigned to a third party. A player’s new club shall be held jointly liable to pay compensation if, having regard to the individual facts and circumstances of each case, it can be established that the new club induced the player to breach their contract.", "3. In addition to the obligation to pay compensation, sporting sanctions shall also be imposed on any player found to be in breach of contract during the protected period. This sanction shall be a four-month restriction on playing in official matches. In the case of aggravating circumstances, the restriction shall last six months. These sporting sanctions shall take effect immediately once the player has been notified of the relevant decision. The sporting sanctions shall remain suspended in the period between the last official match of the season and the first official match of the next season, in both cases including national cups and international championships for clubs. This suspension of the sporting sanctions shall, however, not be applicable if the player is an established member of the representative team of the association he is eligible to represent, and the association concerned is participating in the final competition of an international tournament in the period between the last match and the first match of the next season. Unilateral breach without just cause or sporting just cause after the protected period shall not result in sporting sanctions. Disciplinary measures may, however, be imposed outside the protected period for failure to give notice of termination within 15 days of the last official match of the season (including national cups) of the club with which the player is registered. The protected period starts again when, while renewing the contract, the duration of the previous contract is extended.", "4. A sporting sanction shall be imposed (i) on any club found to be in breach of contract during the protected period or (ii) on a player’s new club if, having regard to the individual facts and circumstances of each case, it can be established that the new club induced the player to breach the contract during the protected period. The club shall be banned from registering any new players, either nationally or internationally, for two entire and consecutive registration periods. The club shall be able to register new players, either nationally or internationally, only as of the next registration period following the complete serving of the relevant sporting sanction. In particular, it may not make use of the exceptions stipulated in article 6 paragraph 3 of these regulations in order to register players at an earlier stage.", "5. Any person subject to the FIFA Statutes and regulations who acts in a manner designed to induce a breach of contract between a professional and a club in order to facilitate the transfer of the player shall be sanctioned."]}, "RSTP:18": {"h": "Article 18: Special provisions relating to contracts between professionals and clubs", "p": ["1. Any employment contract that is concluded following the provision of football agent services shall specify the football agent’s name, their client, their FIFA licence number and their signature, in accordance with the FIFA Football Agent Regulations.", "2. The minimum length of a contract shall be from its effective date until the end of the season, while the maximum length of a contract shall be five years. Contracts of any other length shall only be permitted if consistent with national laws. Players under the age of 18 may not sign a professional contract for a term longer than three years. Any clause referring to a longer period shall not be recognised.", "3. A club intending to conclude a contract with a professional must inform the player’s current club in writing before entering into negotiations with him. A professional shall only be free to conclude a contract with another club if his contract with his present club has expired or is due to expire within six months. Any breach of this provision shall be subject to appropriate sanctions.", "4. The validity of a contract may not be made subject to a successful medical examination and/or the grant of a work permit.", "5. If a professional enters into more than one contract covering the same period, the provisions set forth in Chapter IV shall apply.", "6. Contractual clauses granting the club additional time to pay to the professional amounts that have fallen due under the terms of the contract (so-called “grace periods”) shall not be recognised. Grace periods contained in collective bargaining agreements validly negotiated by employers’ and employees’ representatives at domestic level in accordance with national law shall, however, be legally binding and recognised. Contracts existing at the time of this provision coming
